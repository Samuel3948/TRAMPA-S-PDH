<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌟 DEVIL'S ASCENT - Edición Definitiva</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        body {
            background: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        
        #gameWrapper {
            background: linear-gradient(145deg, #1a1a3e, #0a0a1a);
            border-radius: 25px;
            padding: 15px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.05);
            border: 2px solid rgba(233, 69, 96, 0.3);
            max-width: 98vw;
            position: relative;
        }
        
        #gameContainer {
            position: relative;
            background: #0f1a2e;
            border-radius: 15px;
            overflow: hidden;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: auto;
            background: #0f1a2e;
            touch-action: none;
            cursor: pointer;
        }
        
        /* ===== MENÚ DE INICIO ===== */
        #menuOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            padding: 20px;
        }
        
        #menuOverlay.hidden {
            display: none;
        }
        
        #menuTitle {
            font-size: 42px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 40px rgba(233,69,96,0.6), 0 4px 20px rgba(0,0,0,0.8);
            margin-bottom: 5px;
            text-align: center;
            letter-spacing: 2px;
        }
        
        #menuSubtitle {
            color: rgba(255,255,255,0.6);
            font-size: 16px;
            margin-bottom: 25px;
            text-align: center;
            letter-spacing: 4px;
        }
        
        #menuWorldSelect {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            max-width: 600px;
            margin-bottom: 20px;
        }
        
        .world-btn {
            background: linear-gradient(145deg, #1a1a3e, #2a2a5e);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 15px 25px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 100px;
            text-align: center;
            font-family: inherit;
            touch-action: manipulation;
        }
        
        .world-btn:hover {
            transform: scale(1.05);
            border-color: #e94560;
            background: linear-gradient(145deg, #2a2a5e, #3a3a7e);
        }
        
        .world-btn:active {
            transform: scale(0.95);
        }
        
        .world-btn .emoji {
            font-size: 28px;
            display: block;
            margin-bottom: 5px;
        }
        
        .world-btn .name {
            font-size: 14px;
        }
        
        .world-btn .levels-info {
            font-size: 11px;
            color: rgba(255,255,255,0.4);
            margin-top: 3px;
        }
        
        #menuCustomization {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin: 10px 0 15px 0;
            padding: 12px 18px;
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        .custom-btn {
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 8px 14px;
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            touch-action: manipulation;
            min-height: 40px;
        }
        
        .custom-btn:hover {
            background: rgba(255,255,255,0.15);
            border-color: #e94560;
        }
        
        .custom-btn.active {
            border-color: #e94560;
            background: rgba(233,69,96,0.2);
        }
        
        .custom-btn .preview {
            font-size: 20px;
            display: block;
        }
        
        #menuStartBtn {
            background: linear-gradient(145deg, #e94560, #c23152);
            border: none;
            border-radius: 16px;
            padding: 16px 50px;
            color: #fff;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            touch-action: manipulation;
            box-shadow: 0 8px 30px rgba(233,69,96,0.4);
            margin-top: 5px;
        }
        
        #menuStartBtn:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 40px rgba(233,69,96,0.6);
        }
        
        #menuStartBtn:active {
            transform: scale(0.95);
        }
        
        /* ===== UI DEL JUEGO ===== */
        #topUI {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            background: rgba(0,0,0,0.7);
            border-radius: 12px 12px 0 0;
            border-bottom: 2px solid rgba(233,69,96,0.3);
            flex-wrap: wrap;
            gap: 4px;
        }
        
        #topUI > div {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #eee;
            font-size: 13px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        
        .ui-icon {
            font-size: 16px;
        }
        
        .ui-value {
            background: rgba(0,0,0,0.4);
            padding: 2px 10px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            min-width: 25px;
            text-align: center;
        }
        
        .health-hearts {
            color: #ff4757;
            font-size: 16px;
            letter-spacing: 1px;
        }
        
        .world-badge {
            background: linear-gradient(135deg, #e94560, #c23152);
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        #bottomUI {
            display: flex;
            justify-content: center;
            gap: 6px;
            padding: 8px 12px;
            background: rgba(0,0,0,0.7);
            border-radius: 0 0 12px 12px;
            border-top: 2px solid rgba(233,69,96,0.3);
            flex-wrap: wrap;
        }
        
        #bottomUI button {
            background: linear-gradient(145deg, #2a2a5e, #1a1a3e);
            color: #fff;
            border: 1px solid rgba(233,69,96,0.3);
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            touch-action: manipulation;
            min-height: 38px;
            min-width: 38px;
        }
        
        #bottomUI button:hover {
            background: linear-gradient(145deg, #3a3a7e, #2a2a5e);
            transform: scale(1.05);
            border-color: #e94560;
        }
        
        #bottomUI button:active {
            transform: scale(0.95);
        }
        
        .btn-primary {
            background: linear-gradient(145deg, #e94560, #c23152) !important;
            border-color: #e94560 !important;
        }
        
        .btn-primary:hover {
            background: linear-gradient(145deg, #ff6b81, #e94560) !important;
        }
        
        #mobileControls {
            display: none;
            justify-content: space-between;
            padding: 8px 12px 4px 12px;
            gap: 8px;
        }
        
        .mobile-btn {
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 14px;
            color: #fff;
            font-size: 24px;
            padding: 10px 16px;
            min-width: 52px;
            min-height: 52px;
            text-align: center;
            touch-action: manipulation;
            cursor: pointer;
            transition: all 0.1s;
            backdrop-filter: blur(5px);
            font-weight: bold;
        }
        
        .mobile-btn:active {
            background: rgba(233,69,96,0.4);
            transform: scale(0.92);
            border-color: #e94560;
        }
        
        .mobile-btn.jump-btn {
            background: rgba(233,69,96,0.3);
            border-color: rgba(233,69,96,0.5);
            min-width: 70px;
            font-size: 18px;
        }
        
        .mobile-btn.jump-btn:active {
            background: rgba(233,69,96,0.6);
        }
        
        .mobile-dpad {
            display: flex;
            gap: 6px;
        }
        
        #messageOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 20;
        }
        
        #messageText {
            color: #fff;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 0 40px rgba(233,69,96,0.8), 0 4px 20px rgba(0,0,0,0.8);
            text-align: center;
            padding: 16px 24px;
            opacity: 0;
            transition: opacity 0.4s;
            background: rgba(0,0,0,0.6);
            border-radius: 16px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
            max-width: 90%;
        }
        
        #messageText.show {
            opacity: 1;
        }
        
        .key-hint {
            color: rgba(255,255,255,0.25);
            font-size: 10px;
            text-align: center;
            padding: 4px 0 2px 0;
            letter-spacing: 1px;
        }
        
        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            #gameWrapper {
                padding: 8px;
                border-radius: 15px;
            }
            #topUI {
                padding: 6px 10px;
                font-size: 11px;
            }
            #topUI > div {
                font-size: 11px;
                gap: 4px;
            }
            .health-hearts {
                font-size: 13px;
            }
            .world-badge {
                font-size: 9px;
                padding: 2px 8px;
            }
            #bottomUI {
                padding: 5px 8px;
                gap: 4px;
            }
            #bottomUI button {
                padding: 5px 10px;
                font-size: 10px;
                min-height: 32px;
                min-width: 32px;
            }
            #mobileControls {
                display: flex !important;
            }
            .key-hint {
                display: none;
            }
            #menuTitle {
                font-size: 28px;
            }
            #menuSubtitle {
                font-size: 13px;
            }
            .world-btn {
                padding: 10px 16px;
                font-size: 13px;
                min-width: 70px;
            }
            .world-btn .emoji {
                font-size: 22px;
            }
            #menuStartBtn {
                padding: 12px 30px;
                font-size: 18px;
            }
            #menuCustomization {
                padding: 8px 12px;
                gap: 5px;
            }
            .custom-btn {
                padding: 5px 10px;
                font-size: 11px;
                min-height: 32px;
            }
            #messageText {
                font-size: 20px;
                padding: 12px 16px;
            }
        }
        
        @media (pointer: coarse) {
            #mobileControls {
                display: flex !important;
            }
            .key-hint {
                display: none;
            }
        }
        
        @media (max-width: 480px) {
            #topUI > div {
                font-size: 9px;
            }
            .health-hearts {
                font-size: 11px;
            }
            .mobile-btn {
                font-size: 18px;
                padding: 6px 12px;
                min-width: 42px;
                min-height: 42px;
            }
            .mobile-btn.jump-btn {
                min-width: 56px;
                font-size: 14px;
            }
            #menuTitle {
                font-size: 22px;
            }
            .world-btn {
                padding: 8px 12px;
                font-size: 11px;
                min-width: 60px;
            }
            .world-btn .emoji {
                font-size: 18px;
            }
            #menuStartBtn {
                padding: 10px 20px;
                font-size: 15px;
            }
            #messageText {
                font-size: 16px;
                padding: 10px 14px;
            }
        }
    </style>
</head>
<body>

<div id="gameWrapper">
    <div id="gameContainer">
        <!-- ===== MENÚ DE INICIO ===== -->
        <div id="menuOverlay">
            <div id="menuTitle">⚡ DEVIL'S ASCENT</div>
            <div id="menuSubtitle">— EL DESAFÍO DEFINITIVO —</div>
            
            <div id="menuWorldSelect">
                <button class="world-btn" data-world="0">
                    <span class="emoji">🌲</span>
                    <span class="name">Bosque</span>
                    <span class="levels-info">50 niveles</span>
                </button>
                <button class="world-btn" data-world="1">
                    <span class="emoji">🏜️</span>
                    <span class="name">Desierto</span>
                    <span class="levels-info">50 niveles</span>
                </button>
                <button class="world-btn" data-world="2">
                    <span class="emoji">❄️</span>
                    <span class="name">Tundra</span>
                    <span class="levels-info">50 niveles</span>
                </button>
                <button class="world-btn" data-world="3">
                    <span class="emoji">🌋</span>
                    <span class="name">Volcán</span>
                    <span class="levels-info">50 niveles</span>
                </button>
                <button class="world-btn" data-world="4">
                    <span class="emoji">🌌</span>
                    <span class="name">Espacio</span>
                    <span class="levels-info">50 niveles</span>
                </button>
            </div>
            
            <div id="menuCustomization">
                <button class="custom-btn active" data-custom="color" data-value="blue">
                    <span class="preview">🔵</span> Azul
                </button>
                <button class="custom-btn" data-custom="color" data-value="red">
                    <span class="preview">🔴</span> Rojo
                </button>
                <button class="custom-btn" data-custom="color" data-value="green">
                    <span class="preview">🟢</span> Verde
                </button>
                <button class="custom-btn" data-custom="color" data-value="purple">
                    <span class="preview">🟣</span> Púrpura
                </button>
                <button class="custom-btn" data-custom="color" data-value="gold">
                    <span class="preview">🟡</span> Dorado
                </button>
                <button class="custom-btn" data-custom="hat" data-value="none">
                    <span class="preview">👤</span> Sin
                </button>
                <button class="custom-btn" data-custom="hat" data-value="cap">
                    <span class="preview">🧢</span> Gorra
                </button>
                <button class="custom-btn" data-custom="hat" data-value="tophat">
                    <span class="preview">🎩</span> Chistera
                </button>
                <button class="custom-btn" data-custom="hat" data-value="crown">
                    <span class="preview">👑</span> Corona
                </button>
                <button class="custom-btn" data-custom="accessory" data-value="none">
                    <span class="preview">❌</span> Sin
                </button>
                <button class="custom-btn" data-custom="accessory" data-value="scarf">
                    <span class="preview">🧣</span> Bufanda
                </button>
                <button class="custom-btn" data-custom="accessory" data-value="glasses">
                    <span class="preview">🕶️</span> Gafas
                </button>
                <button class="custom-btn" data-custom="accessory" data-value="cape">
                    <span class="preview">🧥</span> Capa
                </button>
            </div>
            
            <button id="menuStartBtn">🎮 JUGAR</button>
        </div>
        
        <!-- ===== UI DEL JUEGO ===== -->
        <div id="topUI">
            <div>
                <span class="ui-icon">🌍</span>
                <span class="world-badge" id="worldDisplay">Mundo 1</span>
                <span class="ui-icon">🏆</span>
                <span class="ui-value" id="levelDisplay">1</span>
                <span style="color:rgba(255,255,255,0.3);">/</span>
                <span style="color:rgba(255,255,255,0.5);" id="maxLevelDisplay">50</span>
            </div>
            <div>
                <span class="ui-icon">❤️</span>
                <span class="health-hearts" id="heartsDisplay">❤️❤️❤️</span>
            </div>
            <div>
                <span class="ui-icon">⏱️</span>
                <span class="ui-value" id="timerDisplay">0</span>
                <span style="color:rgba(255,255,255,0.3);">s</span>
            </div>
            <div>
                <span class="ui-icon">💀</span>
                <span class="ui-value" id="deathsDisplay">0</span>
            </div>
            <div>
                <button id="menuBtn" style="background:rgba(255,255,255,0.1);border:none;border-radius:8px;padding:4px 10px;color:#fff;cursor:pointer;font-size:16px;">☰</button>
            </div>
        </div>
        
        <!-- Canvas -->
        <canvas id="gameCanvas" width="900" height="550"></canvas>
        
        <!-- Mensajes -->
        <div id="messageOverlay">
            <div id="messageText"></div>
        </div>
        
        <!-- Controles Móviles -->
        <div id="mobileControls">
            <div class="mobile-dpad">
                <div class="mobile-btn" id="btnLeft">◀</div>
                <div class="mobile-btn" id="btnRight">▶</div>
            </div>
            <div class="mobile-btn jump-btn" id="btnJump">▲<br><span style="font-size:9px;">SALTAR</span></div>
        </div>
        
        <!-- UI Inferior -->
        <div id="bottomUI">
            <button id="restartBtn">🔄 Reiniciar</button>
            <button id="prevWorldBtn">◀ Mundo</button>
            <button id="nextWorldBtn">Mundo ▶</button>
            <button id="prevLevelBtn">◀ Nivel</button>
            <button id="nextLevelBtn">Nivel ▶</button>
            <button id="resetGameBtn" class="btn-primary">✨ Nuevo Juego</button>
        </div>
        
        <div class="key-hint">PC: ← → Moverse | ↑ Saltar | R Reiniciar | Móvil: Botones táctiles</div>
    </div>
</div>

<script>
    // ================================================================
    //  DEVIL'S ASCENT - EDICIÓN DEFINITIVA
    //  Menú de inicio | Brazos | Personalización | Todas las trampas
    //  Paso automático al tocar la meta | 250 niveles
    // ================================================================
    
    // --- Configuración Canvas ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const W = 900, H = 550;
    
    // --- Elementos UI ---
    const menuOverlay = document.getElementById('menuOverlay');
    const menuStartBtn = document.getElementById('menuStartBtn');
    const menuBtn = document.getElementById('menuBtn');
    const worldDisplay = document.getElementById('worldDisplay');
    const levelDisplay = document.getElementById('levelDisplay');
    const maxLevelDisplay = document.getElementById('maxLevelDisplay');
    const heartsDisplay = document.getElementById('heartsDisplay');
    const timerDisplay = document.getElementById('timerDisplay');
    const deathsDisplay = document.getElementById('deathsDisplay');
    const messageText = document.getElementById('messageText');
    
    // --- Constantes ---
    const GRAVITY = 0.55;
    const FRICTION = 0.88;
    const PLAYER_SPEED = 4.2;
    const JUMP_FORCE = -10.5;
    const MAX_HEARTS = 3;
    const TOTAL_WORLDS = 5;
    const LEVELS_PER_WORLD = 50;
    const TOTAL_LEVELS = TOTAL_WORLDS * LEVELS_PER_WORLD;
    
    // --- Personalización del jugador ---
    const customization = {
        color: 'blue',
        hat: 'none',
        accessory: 'none'
    };
    
    const colorMap = {
        blue: { body: '#4fc3f7', bodyDark: '#0288d1', skin: '#ffccbc', accent: '#e94560' },
        red: { body: '#ff6b6b', bodyDark: '#c0392b', skin: '#ffccbc', accent: '#f39c12' },
        green: { body: '#6bcb77', bodyDark: '#27ae60', skin: '#ffccbc', accent: '#f1c40f' },
        purple: { body: '#a855f7', bodyDark: '#7c3aed', skin: '#ffccbc', accent: '#ec4899' },
        gold: { body: '#fbbf24', bodyDark: '#d97706', skin: '#ffccbc', accent: '#e94560' }
    };
    
    // --- Estado ---
    let currentWorld = 0;
    let currentLevelInWorld = 0;
    let hearts = MAX_HEARTS;
    let totalDeaths = 0;
    let gameTime = 0;
    let gameRunning = true;
    let levelComplete = false;
    let deathAnimation = false;
    let deathTimer = 0;
    let particles = [];
    let frameCount = 0;
    let messageTimeout = null;
    let comboCount = 0;
    let showMenu = true;
    let selectedWorld = 0;
    
    // --- Teclas ---
    const keys = {};
    
    // --- Jugador ---
    const player = {
        x: 60,
        y: 400,
        w: 30,
        h: 46,
        vx: 0,
        vy: 0,
        onGround: false,
        facing: 1,
        jumping: false,
        walkFrame: 0,
        walkTimer: 0,
        airTimer: 0,
        hurtTimer: 0,
        invincible: false,
        invincibleTimer: 0,
        armAngle: 0,
        legAngle: 0
    };
    
    // --- Niveles ---
    let levels = [];
    let levelState = {};
    
    // ================================================================
    //  GENERADOR DE NIVELES (TODAS LAS TRAMPAS INCLUIDAS)
    // ================================================================
    function generateAllLevels() {
        levels = [];
        
        const worldThemes = [
            { name: '🌲 Bosque', bg: 'forest', color: '#1a3a2a', trapColor: '#e94560', platformColor: '#4a8a5a' },
            { name: '🏜️ Desierto', bg: 'desert', color: '#3a2a1a', trapColor: '#ff6b35', platformColor: '#c47a3a' },
            { name: '❄️ Tundra', bg: 'tundra', color: '#1a2a3a', trapColor: '#4fc3f7', platformColor: '#6bcb77' },
            { name: '🌋 Volcán', bg: 'volcano', color: '#2a0a0a', trapColor: '#ff4757', platformColor: '#e94560' },
            { name: '🌌 Espacio', bg: 'space', color: '#0a0a2a', trapColor: '#a855f7', platformColor: '#6366f1' }
        ];
        
        for (let w = 0; w < TOTAL_WORLDS; w++) {
            const theme = worldThemes[w];
            
            for (let lv = 0; lv < LEVELS_PER_WORLD; lv++) {
                const difficulty = Math.min(2, Math.floor(lv / 17));
                const levelNum = lv + 1;
                const level = generateLevel(w, lv, difficulty, theme);
                levels.push(level);
            }
        }
    }
    
    // ================================================================
    //  GENERAR UN NIVEL (CON TODAS LAS TRAMPAS)
    // ================================================================
    function generateLevel(world, levelIndex, difficulty, theme) {
        const levelNum = levelIndex + 1;
        const isBossLevel = (levelNum % 10 === 0);
        const isBonusLevel = (levelNum % 5 === 0 && !isBossLevel);
        
        const level = {
            world: world,
            index: levelIndex,
            number: levelNum,
            theme: theme,
            difficulty: difficulty,
            isBossLevel: isBossLevel,
            isBonusLevel: isBonusLevel,
            platforms: [],
            traps: [],
            spikes: [],
            movingPlatforms: [],
            fallingPlatforms: [],
            goal: {x: 820, y: 470, w: 40, h: 40},
            playerStart: {x: 50, y: 470},
            specialEffects: [],
            darkMode: false,
            fireParticles: false,
            invertedGravity: false,
            wind: 0,
            name: generateLevelName(world, levelNum, isBossLevel, isBonusLevel)
        };
        
        // --- Plataforma base ---
        level.platforms.push({x: 0, y: 510, w: 900, h: 40, type: 'solid'});
        
        // --- Generar plataformas ---
        const numPlatforms = 4 + difficulty * 2 + Math.floor(levelNum / 10);
        const platformSpacing = Math.max(65, 120 - difficulty * 15);
        const heightVariation = 40 + difficulty * 20 + Math.floor(levelNum / 8) * 5;
        
        let lastX = 80;
        let lastY = 470;
        let platformCount = 0;
        let minHeight = 100 + difficulty * 30 + Math.floor(levelNum / 15) * 10;
        
        for (let i = 0; i < numPlatforms && platformCount < 20; i++) {
            const pWidth = 45 + Math.floor(Math.random() * 55) + (isBonusLevel ? 20 : 0);
            const pX = lastX + platformSpacing + Math.random() * 40;
            const pY = Math.max(minHeight, lastY - heightVariation * (0.5 + Math.random() * 0.9));
            
            if (pY < minHeight + 30 && i > 2) continue;
            
            let type = 'solid';
            const rand = Math.random();
            if (difficulty >= 1 && rand < 0.15 + difficulty * 0.1) type = 'moving';
            if (difficulty >= 2 && rand > 0.8 && rand < 0.92) type = 'falling';
            if (isBonusLevel && rand < 0.25) type = 'moving';
            
            const platform = {x: pX, y: pY, w: pWidth, h: 18, type: type};
            
            if (type === 'moving') {
                platform.moveX = 70 + Math.random() * 130;
                platform.speed = 0.7 + Math.random() * 1.3;
                platform.phase = Math.random() * Math.PI * 2;
                level.movingPlatforms.push(platform);
            }
            if (type === 'falling') {
                platform.fallDelay = 25 + Math.floor(Math.random() * 45);
                level.fallingPlatforms.push(platform);
            }
            
            level.platforms.push(platform);
            lastX = pX + pWidth;
            lastY = pY;
            platformCount++;
            minHeight = Math.min(minHeight, pY);
        }
        
        // --- Plataforma final ---
        level.platforms.push({x: 760, y: 470, w: 100, h: 18, type: 'solid'});
        
        // ============================================================
        //  TODAS LAS TRAMPAS (PÚAS FIJAS, MÓVILES, LÁSERES, ETC.)
        // ============================================================
        
        // --- Púas fijas (en el suelo y plataformas) ---
        const numSpikes = 2 + difficulty * 2 + Math.floor(levelNum / 10);
        for (let i = 0; i < Math.min(numSpikes, 14); i++) {
            let spikeX, spikeY;
            let attempts = 0;
            let valid = false;
            
            while (!valid && attempts < 25) {
                spikeX = 40 + Math.random() * 760;
                // Poner púas en el suelo o en plataformas
                if (Math.random() < 0.6) {
                    spikeY = 490 + Math.random() * 10;
                } else {
                    // Buscar una plataforma
                    const p = level.platforms[Math.floor(Math.random() * level.platforms.length)];
                    if (p && p.y > 400) {
                        spikeX = p.x + 10 + Math.random() * (p.w - 30);
                        spikeY = p.y - 16;
                    } else {
                        spikeY = 490 + Math.random() * 10;
                    }
                }
                valid = true;
                for (const s of level.spikes) {
                    if (Math.abs(s.x - spikeX) < 30 && Math.abs(s.y - spikeY) < 30) {
                        valid = false;
                        break;
                    }
                }
                for (const p of level.platforms) {
                    if (spikeX > p.x - 15 && spikeX < p.x + p.w + 15 && spikeY > p.y - 20 && spikeY < p.y + 10) {
                        valid = false;
                        break;
                    }
                }
                attempts++;
            }
            
            if (valid) {
                level.spikes.push({
                    x: spikeX,
                    y: spikeY,
                    w: 22,
                    h: 16,
                    type: 'spike'
                });
            }
        }
        
        // --- Trampas activas (púas pulsantes y láseres) ---
        const numTraps = 1 + difficulty + Math.floor(levelNum / 12);
        for (let i = 0; i < Math.min(numTraps, 8); i++) {
            let trapX = 60 + Math.random() * 720;
            let trapY = 490 + Math.random() * 10;
            
            // Buscar lugar en plataformas
            for (const p of level.platforms) {
                if (trapX > p.x + 10 && trapX < p.x + p.w - 20 && p.y > 450) {
                    trapY = p.y - 16;
                    break;
                }
            }
            
            const trapType = Math.random() < 0.45 ? 'spike' : 'laser';
            level.traps.push({
                x: trapX,
                y: trapY,
                w: 28 + Math.random() * 24,
                h: 18,
                type: trapType,
                active: true,
                pattern: Math.random() < 0.5 ? 'pulse' : 'sweep',
                phase: Math.random() * Math.PI * 2,
                speed: 1.2 + Math.random() * 2.2
            });
        }
        
        // --- Trampas en el suelo (adicionales) ---
        if (difficulty >= 1) {
            for (let i = 0; i < 1 + difficulty; i++) {
                const x = 100 + i * 200 + Math.random() * 80;
                level.traps.push({
                    x: x,
                    y: 490,
                    w: 30,
                    h: 18,
                    type: 'spike',
                    active: true,
                    pattern: 'pulse',
                    phase: i * 0.5,
                    speed: 1.5 + Math.random()
                });
            }
        }
        
        // --- Efectos especiales ---
        if (world === 2 && levelNum > 15) level.darkMode = true;
        if (world === 3 && levelNum > 20) level.fireParticles = true;
        if (world === 4 && levelNum > 30) level.invertedGravity = true;
        if (world === 4 && levelNum > 40) level.wind = (Math.random() - 0.5) * 0.3;
        
        // --- Niveles jefe ---
        if (isBossLevel) {
            level.bossMode = true;
            for (let i = 0; i < 4; i++) {
                level.traps.push({
                    x: 80 + i * 200 + Math.random() * 60,
                    y: 490,
                    w: 35,
                    h: 18,
                    type: 'laser',
                    active: true,
                    pattern: 'sweep',
                    phase: i * 0.25,
                    speed: 2 + Math.random() * 0.5
                });
            }
            // Más púas en nivel jefe
            for (let i = 0; i < 6; i++) {
                level.spikes.push({
                    x: 60 + i * 140 + Math.random() * 30,
                    y: 490,
                    w: 22,
                    h: 16,
                    type: 'spike'
                });
            }
            level.goal.x = 850;
        }
        
        // --- Niveles bonus ---
        if (isBonusLevel && !isBossLevel) {
            level.bonusMode = true;
            level.goal.x = 850;
            level.specialEffects.push({type: 'stars', count: 5 + Math.floor(Math.random() * 10)});
        }
        
        return level;
    }
    
    // ================================================================
    //  GENERAR NOMBRE DEL NIVEL
    // ================================================================
    function generateLevelName(world, num, isBoss, isBonus) {
        const worldNames = ['Bosque', 'Desierto', 'Tundra', 'Volcán', 'Espacio'];
        const prefixes = ['Camino', 'Sendero', 'Cueva', 'Pico', 'Valle', 'Cascada', 'Abismo', 'Cumbre', 'Cañón', 'Cráter'];
        const suffixes = ['del Alba', 'del Crepúsculo', 'de la Muerte', 'del Fuego', 'del Hielo', 'de la Luz', 'de la Sombra', 'del Viento', 'del Trueno', 'del Silencio'];
        
        if (isBoss) return `👑 JEFE: ${worldNames[world]} ${num}`;
        if (isBonus) return `⭐ BONUS: ${worldNames[world]} ${num}`;
        
        const p = prefixes[num % prefixes.length];
        const s = suffixes[num % suffixes.length];
        return `${p} ${s}`;
    }
    
    // ================================================================
    //  INICIALIZAR NIVEL
    // ================================================================
    function initLevel() {
        const levelIndex = currentWorld * LEVELS_PER_WORLD + currentLevelInWorld;
        const level = levels[levelIndex];
        if (!level) {
            if (currentWorld < TOTAL_WORLDS - 1) {
                currentWorld++;
                currentLevelInWorld = 0;
                initLevel();
            }
            return;
        }
        
        player.x = level.playerStart.x || 50;
        player.y = level.playerStart.y || 470;
        player.vx = 0;
        player.vy = 0;
        player.onGround = false;
        player.invincible = false;
        player.invincibleTimer = 0;
        player.hurtTimer = 0;
        
        levelState = {
            movingPlatforms: [],
            fallingPlatforms: [],
            trapTimers: {},
            platformStates: {},
            specialParticles: []
        };
        
        level.movingPlatforms.forEach((p, idx) => {
            levelState.movingPlatforms.push({
                index: idx,
                origX: p.x,
                origY: p.y,
                phase: p.phase || 0,
                timer: Math.random() * 100
            });
        });
        
        level.fallingPlatforms.forEach((p, idx) => {
            levelState.fallingPlatforms.push({
                index: idx,
                origX: p.x,
                origY: p.y,
                timer: 0,
                falling: false,
                fallSpeed: 0,
                resetTimer: 0
            });
        });
        
        level.traps.forEach((trap, idx) => {
            levelState.trapTimers[idx] = Math.random() * 100;
        });
        
        gameTime = 0;
        levelComplete = false;
        deathAnimation = false;
        deathTimer = 0;
        particles = [];
        comboCount = 0;
        
        updateUI();
        
        const levelNum = currentLevelInWorld + 1;
        const worldNum = currentWorld + 1;
        let msg = `🌍 Mundo ${worldNum} - Nivel ${levelNum}`;
        if (level.isBossLevel) msg = `👑 ${level.name}`;
        else if (level.isBonusLevel) msg = `⭐ ${level.name}`;
        else msg = `${level.name}`;
        
        showMessage(msg, 1800);
        gameRunning = true;
    }
    
    // ================================================================
    //  ACTUALIZAR UI
    // ================================================================
    function updateUI() {
        const worldNum = currentWorld + 1;
        const levelNum = currentLevelInWorld + 1;
        
        worldDisplay.textContent = `Mundo ${worldNum}`;
        levelDisplay.textContent = levelNum;
        maxLevelDisplay.textContent = LEVELS_PER_WORLD;
        
        let heartsStr = '';
        for (let i = 0; i < MAX_HEARTS; i++) {
            heartsStr += i < hearts ? '❤️' : '🖤';
        }
        heartsDisplay.textContent = heartsStr;
        
        timerDisplay.textContent = Math.floor(gameTime);
        deathsDisplay.textContent = totalDeaths;
    }
    
    // ================================================================
    //  MOSTRAR MENSAJE
    // ================================================================
    function showMessage(text, duration = 2000) {
        messageText.textContent = text;
        messageText.classList.add('show');
        clearTimeout(messageTimeout);
        messageTimeout = setTimeout(() => {
            messageText.classList.remove('show');
        }, duration);
    }
    
    // ================================================================
    //  COLISIONES
    // ================================================================
    function rectCollide(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x &&
               a.y < b.y + b.h && a.y + a.h > b.y;
    }
    
    // ================================================================
    //  ACTUALIZACIÓN DEL JUEGO
    // ================================================================
    function update() {
        if (!gameRunning || deathAnimation || levelComplete || showMenu) return;
        
        const levelIndex = currentWorld * LEVELS_PER_WORLD + currentLevelInWorld;
        const level = levels[levelIndex];
        if (!level) return;
        
        frameCount++;
        gameTime += 1/60;
        
        if (player.invincible) {
            player.invincibleTimer--;
            if (player.invincibleTimer <= 0) player.invincible = false;
        }
        
        // --- Gravedad ---
        if (level.invertedGravity) {
            player.vy -= GRAVITY * 0.7;
        } else {
            player.vy += GRAVITY;
        }
        
        if (level.wind) {
            player.vx += level.wind * 0.1;
        }
        
        // --- Movimiento ---
        let moveX = 0;
        if (keys['ArrowLeft'] || keys['KeyA'] || keys['left']) moveX = -1;
        if (keys['ArrowRight'] || keys['KeyD'] || keys['right']) moveX = 1;
        
        player.vx += moveX * 0.7;
        player.vx *= FRICTION;
        const maxSpeed = PLAYER_SPEED + (level.wind ? Math.abs(level.wind) * 2 : 0);
        if (Math.abs(player.vx) > maxSpeed) {
            player.vx = maxSpeed * Math.sign(player.vx);
        }
        
        // --- Salto ---
        const jumpKey = keys['ArrowUp'] || keys['KeyW'] || keys['Space'] || keys['jump'];
        if (jumpKey && player.onGround) {
            player.vy = JUMP_FORCE;
            player.onGround = false;
            player.jumping = true;
            for (let i = 0; i < 6; i++) {
                particles.push({
                    x: player.x + player.w/2 + (Math.random() - 0.5) * 20,
                    y: player.y + player.h,
                    vx: (Math.random() - 0.5) * 2.5,
                    vy: -Math.random() * 2.5,
                    life: 0.5 + Math.random() * 0.3,
                    color: 'rgba(200,200,255,0.4)',
                    size: 3 + Math.random() * 3
                });
            }
        }
        
        if (player.jumping && !jumpKey) {
            if (player.vy < -3) player.vy = -3;
            player.jumping = false;
        }
        
        // --- Animación ---
        if (Math.abs(player.vx) > 0.5 && player.onGround) {
            player.walkTimer += Math.abs(player.vx) * 0.05;
            if (player.walkTimer > 1) {
                player.walkTimer = 0;
                player.walkFrame = (player.walkFrame + 1) % 4;
            }
        } else if (player.onGround) {
            player.walkFrame = 0;
            player.walkTimer = 0;
        }
        
        if (moveX > 0) player.facing = 1;
        else if (moveX < 0) player.facing = -1;
        
        // --- Animación de brazos ---
        if (!player.onGround) {
            player.armAngle += 0.08;
        } else if (Math.abs(player.vx) > 0.5) {
            player.armAngle += 0.05 * Math.sign(player.vx);
        }
        
        // --- Movimiento horizontal ---
        player.x += player.vx;
        
        for (const p of level.platforms) {
            let px = p.x, py = p.y;
            const movingIdx = level.movingPlatforms.indexOf(p);
            if (movingIdx !== -1) {
                const state = levelState.movingPlatforms.find(s => s.index === movingIdx);
                if (state) {
                    px = state.origX + Math.sin(state.timer * p.speed + state.phase) * (p.moveX || 0);
                }
            }
            const fallingIdx = level.fallingPlatforms.indexOf(p);
            if (fallingIdx !== -1) {
                const state = levelState.fallingPlatforms.find(s => s.index === fallingIdx);
                if (state && state.falling) {
                    py = state.origY + state.fallSpeed;
                }
            }
            
            if (rectCollide(player, {x: px, y: py, w: p.w, h: p.h})) {
                if (player.vx > 0) {
                    player.x = px - player.w;
                } else if (player.vx < 0) {
                    player.x = px + p.w;
                }
                player.vx = 0;
            }
        }
        
        // --- Movimiento vertical ---
        player.y += player.vy;
        player.onGround = false;
        
        for (const p of level.platforms) {
            let px = p.x, py = p.y;
            const movingIdx = level.movingPlatforms.indexOf(p);
            if (movingIdx !== -1) {
                const state = levelState.movingPlatforms.find(s => s.index === movingIdx);
                if (state) {
                    px = state.origX + Math.sin(state.timer * p.speed + state.phase) * (p.moveX || 0);
                }
            }
            const fallingIdx = level.fallingPlatforms.indexOf(p);
            if (fallingIdx !== -1) {
                const state = levelState.fallingPlatforms.find(s => s.index === fallingIdx);
                if (state && state.falling) {
                    py = state.origY + state.fallSpeed;
                }
            }
            
            if (rectCollide(player, {x: px, y: py, w: p.w, h: p.h})) {
                if (player.vy > 0) {
                    player.y = py - player.h;
                    player.vy = 0;
                    player.onGround = true;
                } else if (player.vy < 0) {
                    player.y = py + p.h;
                    player.vy = 0;
                }
            }
        }
        
        // --- Actualizar plataformas móviles ---
        for (const state of levelState.movingPlatforms) {
            state.timer += 0.025;
        }
        
        // --- Actualizar plataformas que caen ---
        for (const state of levelState.fallingPlatforms) {
            const p = level.platforms[level.platforms.indexOf(level.fallingPlatforms[state.index])];
            if (!p) continue;
            
            if (state.falling) {
                state.fallSpeed += 0.4;
                if (state.fallSpeed > 12) state.fallSpeed = 12;
                state.resetTimer++;
                if (state.resetTimer > 100) {
                    state.falling = false;
                    state.fallSpeed = 0;
                    state.resetTimer = 0;
                }
            } else {
                state.timer++;
                if (state.timer > (p.fallDelay || 50)) {
                    const px = p.x;
                    const py = p.y;
                    if (player.x + player.w > px && player.x < px + p.w &&
                        player.y + player.h >= py && player.y + player.h <= py + p.h + 5) {
                        state.falling = true;
                        state.timer = 0;
                    }
                }
            }
        }
        
        // --- Colisiones con púas fijas ---
        if (!player.invincible) {
            for (const spike of level.spikes) {
                if (rectCollide(player, spike)) {
                    playerHit();
                    break;
                }
            }
            
            // --- Colisiones con trampas activas ---
            for (let i = 0; i < level.traps.length; i++) {
                const trap = level.traps[i];
                if (!trap.active) continue;
                
                levelState.trapTimers[i] = (levelState.trapTimers[i] || 0) + 0.025;
                const timer = levelState.trapTimers[i];
                
                let active = false;
                if (trap.pattern === 'pulse') {
                    active = Math.sin(timer * 3 * trap.speed) > 0.2;
                } else if (trap.pattern === 'sweep') {
                    const phase = trap.phase || 0;
                    active = Math.sin(timer * 2 * trap.speed + phase * Math.PI * 2) > 0.3;
                }
                
                if (active) {
                    let trapRect = {...trap};
                    if (trap.type === 'laser') {
                        trapRect.h = 10;
                        trapRect.y += 12;
                        trapRect.w = trap.w + 10;
                    }
                    if (rectCollide(player, trapRect)) {
                        playerHit();
                        break;
                    }
                }
            }
        }
        
        // --- Colisión con la meta (PASO AUTOMÁTICO) ---
        if (rectCollide(player, level.goal)) {
            levelComplete = true;
            const levelNum = currentLevelInWorld + 1;
            const worldNum = currentWorld + 1;
            
            comboCount++;
            let bonusMsg = '';
            if (comboCount >= 5) bonusMsg = ' 🔥 ¡Racha de 5!';
            if (comboCount >= 10) bonusMsg = ' ⚡ ¡Racha de 10!';
            
            // Partículas de celebración
            for (let i = 0; i < 30; i++) {
                particles.push({
                    x: level.goal.x + level.goal.w/2,
                    y: level.goal.y + level.goal.h/2,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12 - 4,
                    life: 1 + Math.random() * 0.5,
                    color: `hsl(${Math.random() * 60 + 20}, 100%, 60%)`,
                    size: 4 + Math.random() * 6
                });
            }
            
            if (currentLevelInWorld >= LEVELS_PER_WORLD - 1) {
                if (currentWorld >= TOTAL_WORLDS - 1) {
                    showMessage(`🎉 ¡JUEGO COMPLETADO! 🎉\nMundo ${worldNum} - Nivel ${levelNum}${bonusMsg}`, 4000);
                    gameRunning = false;
                } else {
                    showMessage(`🌟 ¡Mundo ${worldNum} Completado! 🌟\nPasando al Mundo ${worldNum + 1}${bonusMsg}`, 2500);
                    setTimeout(() => {
                        currentWorld++;
                        currentLevelInWorld = 0;
                        hearts = MAX_HEARTS;
                        initLevel();
                        gameRunning = true;
                    }, 2500);
                }
            } else {
                showMessage(`✅ ¡Nivel ${levelNum} Completado!${bonusMsg}`, 1500);
                setTimeout(() => {
                    currentLevelInWorld++;
                    initLevel();
                    gameRunning = true;
                }, 1500);
            }
            updateUI();
            return;
        }
        
        // --- Caer al vacío ---
        if (player.y > H + 100) {
            playerDie();
        }
        
        updateParticles();
        updateUI();
    }
    
    // ================================================================
    //  GOLPE AL JUGADOR
    // ================================================================
    function playerHit() {
        if (player.invincible || deathAnimation) return;
        
        hearts--;
        player.invincible = true;
        player.invincibleTimer = 60;
        player.hurtTimer = 10;
        
        for (let i = 0; i < 15; i++) {
            particles.push({
                x: player.x + player.w/2,
                y: player.y + player.h/2,
                vx: (Math.random() - 0.5) * 6,
                vy: (Math.random() - 0.5) * 6 - 2,
                life: 0.5 + Math.random() * 0.5,
                color: `hsl(${Math.random() * 40 + 340}, 100%, 60%)`,
                size: 3 + Math.random() * 5
            });
        }
        
        if (hearts <= 0) {
            playerDie();
        } else {
            showMessage(`💔 ¡Te hirieron! ${hearts} ❤️ restantes`, 1000);
            updateUI();
        }
    }
    
    // ================================================================
    //  MUERTE DEL JUGADOR
    // ================================================================
    function playerDie() {
        if (deathAnimation) return;
        
        deathAnimation = true;
        deathTimer = 0;
        totalDeaths++;
        comboCount = 0;
        
        for (let i = 0; i < 40; i++) {
            particles.push({
                x: player.x + player.w/2,
                y: player.y + player.h/2,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.5) * 10 - 3,
                life: 0.8 + Math.random() * 0.5,
                color: `hsl(${Math.random() * 60 + 340}, 100%, 50%)`,
                size: 4 + Math.random() * 6
            });
        }
        
        hearts = MAX_HEARTS;
        updateUI();
        showMessage(`💀 ¡Has muerto! (${totalDeaths} muertes)`, 1500);
        
        setTimeout(() => {
            const levelIndex = currentWorld * LEVELS_PER_WORLD + currentLevelInWorld;
            const level = levels[levelIndex];
            if (level) {
                player.x = level.playerStart.x || 50;
                player.y = level.playerStart.y || 470;
                player.vx = 0;
                player.vy = 0;
                player.onGround = false;
                player.invincible = true;
                player.invincibleTimer = 90;
            }
            deathAnimation = false;
            gameRunning = true;
            updateUI();
        }, 800);
    }
    
    // ================================================================
    //  PARTÍCULAS
    // ================================================================
    function updateParticles() {
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.08;
            p.life -= 0.015;
            if (p.life <= 0) {
                particles.splice(i, 1);
            }
        }
    }
    
    // ================================================================
    //  DIBUJO DEL JUEGO
    // ================================================================
    function draw() {
        const levelIndex = currentWorld * LEVELS_PER_WORLD + currentLevelInWorld;
        const level = levels[levelIndex];
        if (!level) {
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = '#fff';
            ctx.font = '24px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Cargando niveles...', W/2, H/2);
            return;
        }
        
        ctx.clearRect(0, 0, W, H);
        drawBackground(level);
        
        // --- Dibujar plataformas ---
        for (let i = 0; i < level.platforms.length; i++) {
            const p = level.platforms[i];
            let px = p.x, py = p.y;
            
            const movingIdx = level.movingPlatforms.indexOf(p);
            if (movingIdx !== -1) {
                const state = levelState.movingPlatforms.find(s => s.index === movingIdx);
                if (state) {
                    px = state.origX + Math.sin(state.timer * p.speed + state.phase) * (p.moveX || 0);
                }
            }
            const fallingIdx = level.fallingPlatforms.indexOf(p);
            if (fallingIdx !== -1) {
                const state = levelState.fallingPlatforms.find(s => s.index === fallingIdx);
                if (state && state.falling) {
                    py = state.origY + state.fallSpeed;
                    ctx.shadowColor = 'rgba(255,50,50,0.4)';
                    ctx.shadowBlur = 20;
                }
            }
            
            let color = level.theme.platformColor || '#4a6fa5';
            if (p.type === 'moving') {
                color = '#6bcb77';
                ctx.shadowBlur = 15;
                ctx.shadowColor = 'rgba(100,255,150,0.3)';
            } else if (p.type === 'falling') {
                color = '#ff6b6b';
                ctx.shadowBlur = 15;
                ctx.shadowColor = 'rgba(255,50,50,0.3)';
            } else {
                ctx.shadowBlur = 8;
                ctx.shadowColor = 'rgba(100,150,255,0.2)';
            }
            
            const grad = ctx.createLinearGradient(px, py, px, py + p.h);
            grad.addColorStop(0, color);
            grad.addColorStop(1, darkenColor(color, 0.4));
            ctx.fillStyle = grad;
            ctx.fillRect(px, py, p.w, p.h);
            ctx.shadowBlur = 0;
            
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.lineWidth = 1;
            ctx.strokeRect(px, py, p.w, p.h);
            
            if (p.type === 'moving') {
                ctx.fillStyle = 'rgba(255,255,255,0.1)';
                ctx.fillRect(px + 5, py + 3, p.w - 10, 4);
            }
        }
        
        // --- Dibujar púas fijas ---
        for (const spike of level.spikes) {
            drawSpike(spike.x, spike.y, spike.w, spike.h);
        }
        
        // --- Dibujar trampas activas ---
        for (let i = 0; i < level.traps.length; i++) {
            const trap = level.traps[i];
            if (!trap.active) continue;
            
            const timer = levelState.trapTimers[i] || 0;
            let active = false;
            
            if (trap.pattern === 'pulse') {
                active = Math.sin(timer * 3 * trap.speed) > 0.2;
            } else if (trap.pattern === 'sweep') {
                const phase = trap.phase || 0;
                active = Math.sin(timer * 2 * trap.speed + phase * Math.PI * 2) > 0.3;
            }
            
            if (trap.type === 'spike') {
                if (active) {
                    drawSpike(trap.x, trap.y, trap.w, trap.h);
                    ctx.shadowBlur = 30;
                    ctx.shadowColor = 'rgba(255,0,0,0.5)';
                    ctx.fillStyle = 'rgba(255,0,0,0.1)';
                    ctx.fillRect(trap.x - 5, trap.y - 5, trap.w + 10, trap.h + 10);
                    ctx.shadowBlur = 0;
                }
            } else if (trap.type === 'laser' && active) {
                const grad = ctx.createLinearGradient(trap.x, trap.y + 12, trap.x + trap.w, trap.y + 12);
                grad.addColorStop(0, 'rgba(255,0,0,0)');
                grad.addColorStop(0.1, 'rgba(255,0,0,0.9)');
                grad.addColorStop(0.5, 'rgba(255,200,50,0.9)');
                grad.addColorStop(0.9, 'rgba(255,0,0,0.9)');
                grad.addColorStop(1, 'rgba(255,0,0,0)');
                ctx.fillStyle = grad;
                ctx.shadowBlur = 30;
                ctx.shadowColor = 'rgba(255,50,0,0.8)';
                ctx.fillRect(trap.x, trap.y + 12, trap.w + 10, 8);
                ctx.shadowBlur = 0;
                
                for (let j = 0; j < 6; j++) {
                    ctx.fillStyle = `rgba(255,255,200,${0.1 + Math.random() * 0.2})`;
                    ctx.fillRect(trap.x + j * (trap.w / 6), trap.y + 11 + Math.random() * 10, 2, 2);
                }
            }
        }
        
        // --- Dibujar meta (cuadro dorado) ---
        const goal = level.goal;
        const pulse = Math.sin(frameCount * 0.06) * 0.3 + 0.7;
        ctx.shadowBlur = 30;
        ctx.shadowColor = `rgba(255,215,0,${0.3 * pulse})`;
        
        ctx.fillStyle = `rgba(255,215,0,${0.15 * pulse})`;
        ctx.fillRect(goal.x - 15, goal.y - 15, goal.w + 30, goal.h + 30);
        
        const grad = ctx.createLinearGradient(goal.x, goal.y, goal.x, goal.y + goal.h);
        grad.addColorStop(0, '#ffd93d');
        grad.addColorStop(0.5, '#f9ca24');
        grad.addColorStop(1, '#f0932b');
        ctx.fillStyle = grad;
        ctx.shadowBlur = 30;
        ctx.shadowColor = `rgba(255,215,0,${0.5 * pulse})`;
        ctx.fillRect(goal.x, goal.y, goal.w, goal.h);
        
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#fff';
        ctx.font = '28px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('⭐', goal.x + goal.w/2, goal.y + goal.h/2 + 2);
        
        // --- Dibujar jugador con brazos ---
        drawPlayer();
        
        // --- Partículas ---
        for (const p of particles) {
            ctx.globalAlpha = Math.max(0, p.life);
            ctx.fillStyle = p.color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = p.color;
            ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
        }
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
        
        // --- Efectos especiales ---
        if (level.darkMode) {
            ctx.fillStyle = 'rgba(0,0,0,0.35)';
            ctx.fillRect(0, 0, W, H);
            const grad = ctx.createRadialGradient(
                player.x + player.w/2, player.y + player.h/2, 20,
                player.x + player.w/2, player.y + player.h/2, 200
            );
            grad.addColorStop(0, 'rgba(255,255,255,0)');
            grad.addColorStop(1, 'rgba(0,0,0,0.5)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);
        }
        
        if (level.fireParticles && Math.random() < 0.1) {
            particles.push({
                x: Math.random() * W,
                y: H - 5,
                vx: (Math.random() - 0.5) * 0.5,
                vy: -Math.random() * 1.5 - 0.5,
                life: 0.8 + Math.random() * 0.5,
                color: `hsl(${20 + Math.random() * 30}, 100%, ${40 + Math.random() * 30}%)`,
                size: 3 + Math.random() * 6
            });
        }
        
        if (player.hurtTimer > 0) {
            player.hurtTimer--;
            ctx.fillStyle = `rgba(255,0,0,${player.hurtTimer / 20})`;
            ctx.fillRect(0, 0, W, H);
        }
    }
    
    // ================================================================
    //  DIBUJAR JUGADOR CON BRAZOS Y PERSONALIZACIÓN
    // ================================================================
    function drawPlayer() {
        const p = player;
        if (p.invincible && Math.floor(frameCount / 4) % 2 === 0) return;
        
        const colors = colorMap[customization.color] || colorMap.blue;
        const x = p.x, y = p.y, w = p.w, h = p.h, f = p.facing;
        
        ctx.shadowBlur = 20;
        ctx.shadowColor = 'rgba(79,195,247,0.3)';
        
        // --- Cuerpo ---
        const bodyGrad = ctx.createLinearGradient(x, y, x + w, y + h);
        bodyGrad.addColorStop(0, colors.body);
        bodyGrad.addColorStop(0.5, colors.body);
        bodyGrad.addColorStop(1, colors.bodyDark);
        ctx.fillStyle = bodyGrad;
        ctx.shadowBlur = 15;
        ctx.shadowColor = 'rgba(79,195,247,0.3)';
        roundRect(ctx, x + 2, y + 12, w - 4, h - 20, 6);
        ctx.fill();
        
        // --- Cabeza ---
        ctx.shadowBlur = 10;
        ctx.fillStyle = colors.skin;
        ctx.beginPath();
        ctx.arc(x + w/2, y + 10, 14, 0, Math.PI * 2);
        ctx.fill();
        
        // --- Ojos ---
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(x + w/2 - 5 + f * 3, y + 7, 5, 0, Math.PI * 2);
        ctx.arc(x + w/2 + 5 + f * 3, y + 7, 5, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = '#1a1a2e';
        ctx.beginPath();
        ctx.arc(x + w/2 - 4 + f * 4, y + 8, 2.5, 0, Math.PI * 2);
        ctx.arc(x + w/2 + 6 + f * 4, y + 8, 2.5, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.beginPath();
        ctx.arc(x + w/2 - 3 + f * 3, y + 6, 1.2, 0, Math.PI * 2);
        ctx.arc(x + w/2 + 7 + f * 3, y + 6, 1.2, 0, Math.PI * 2);
        ctx.fill();
        
        // --- Sonrisa ---
        ctx.strokeStyle = '#1a1a2e';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(x + w/2, y + 12, 5, 0.1, Math.PI - 0.1);
        ctx.stroke();
        
        // --- Brazos (ANIMADOS) ---
        ctx.shadowBlur = 5;
        ctx.shadowColor = 'rgba(0,0,0,0.2)';
        ctx.fillStyle = colors.skin;
        
        const armSwing = p.onGround ? Math.sin(p.walkFrame * Math.PI/2) * 6 : -3;
        const armSwing2 = p.onGround ? Math.cos(p.walkFrame * Math.PI/2) * 4 : 0;
        
        // Brazo izquierdo
        ctx.save();
        ctx.translate(x + 2, y + 16);
        ctx.rotate(-0.3 + armSwing * 0.03 + (p.armAngle * 0.02));
        ctx.fillRect(-2, 0, 5, 14);
        // Mano
        ctx.fillStyle = colors.skin;
        ctx.beginPath();
        ctx.arc(0, 14, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        
        // Brazo derecho
        ctx.fillStyle = colors.skin;
        ctx.save();
        ctx.translate(x + w - 2, y + 16);
        ctx.rotate(0.3 - armSwing * 0.03 - (p.armAngle * 0.02));
        ctx.fillRect(-2, 0, 5, 14);
        ctx.fillStyle = colors.skin;
        ctx.beginPath();
        ctx.arc(0, 14, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        
        // --- Piernas ---
        ctx.shadowBlur = 5;
        ctx.shadowColor = 'rgba(0,0,0,0.2)';
        ctx.fillStyle = colors.bodyDark;
        
        const legOffset = p.onGround ? Math.sin(p.walkFrame * Math.PI/2) * 5 : Math.sin(frameCount * 0.15) * 3;
        
        ctx.fillRect(x + 4, y + h - 10, 6, 10 + legOffset);
        ctx.fillRect(x + w - 10, y + h - 10, 6, 10 - legOffset);
        
        // Zapatos
        ctx.fillStyle = colors.accent;
        ctx.fillRect(x + 2, y + h - 2 + legOffset, 10, 4);
        ctx.fillRect(x + w - 12, y + h - 2 - legOffset, 10, 4);
        
        // --- Gorra / Sombrero ---
        if (customization.hat !== 'none') {
            ctx.shadowBlur = 5;
            ctx.shadowColor = 'rgba(0,0,0,0.2)';
            
            if (customization.hat === 'cap') {
                ctx.fillStyle = colors.accent;
                ctx.fillRect(x + w/2 - 10, y - 4, 20, 6);
                ctx.fillRect(x + w/2 + 4, y - 10, 10, 6);
                ctx.fillStyle = '#fff';
                ctx.fillRect(x + w/2 - 6, y - 2, 4, 3);
            } else if (customization.hat === 'tophat') {
                ctx.fillStyle = '#2d1b0e';
                ctx.fillRect(x + w/2 - 10, y - 16, 20, 12);
                ctx.fillRect(x + w/2 - 14, y - 4, 28, 4);
                ctx.fillStyle = '#e94560';
                ctx.fillRect(x + w/2 - 2, y - 16, 4, 2);
            } else if (customization.hat === 'crown') {
                ctx.fillStyle = '#fbbf24';
                ctx.fillRect(x + w/2 - 12, y - 8, 24, 6);
                for (let i = -8; i <= 8; i += 8) {
                    ctx.fillRect(x + w/2 + i, y - 12, 4, 6);
                    ctx.fillStyle = '#ef4444';
                    ctx.fillRect(x + w/2 + i + 1, y - 14, 2, 3);
                    ctx.fillStyle = '#fbbf24';
                }
            }
        }
        
        // --- Accesorios ---
        if (customization.accessory !== 'none') {
            ctx.shadowBlur = 5;
            ctx.shadowColor = 'rgba(0,0,0,0.2)';
            
            if (customization.accessory === 'scarf') {
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(x + 2, y + 18, w - 4, 8);
                ctx.fillRect(x - 6, y + 20, 8, 12);
                ctx.fillRect(x + w - 2, y + 20, 8, 12);
            } else if (customization.accessory === 'glasses') {
                ctx.strokeStyle = '#2d1b0e';
                ctx.lineWidth = 2;
                ctx.strokeRect(x + w/2 - 10, y + 4, 8, 6);
                ctx.strokeRect(x + w/2 + 2, y + 4, 8, 6);
                ctx.beginPath();
                ctx.moveTo(x + w/2 - 2, y + 7);
                ctx.lineTo(x + w/2 + 2, y + 7);
                ctx.stroke();
            } else if (customization.accessory === 'cape') {
                ctx.fillStyle = 'rgba(233,69,96,0.3)';
                ctx.fillRect(x - 10, y + 14, 8, 20);
                ctx.fillRect(x + w + 2, y + 14, 8, 20);
                ctx.fillStyle = 'rgba(233,69,96,0.15)';
                ctx.fillRect(x - 6, y + 18, 4, 16);
                ctx.fillRect(x + w + 2, y + 18, 4, 16);
            }
        }
        
        // --- Cabello ---
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#2d1b0e';
        ctx.beginPath();
        ctx.arc(x + w/2, y + 2, 15, Math.PI, 2 * Math.PI);
        ctx.fill();
        
        // --- Brillo ---
        ctx.fillStyle = 'rgba(255,255,255,0.05)';
        ctx.fillRect(x + 4, y + 14, 6, 8);
        
        ctx.shadowBlur = 0;
    }
    
    // ================================================================
    //  FUNCIÓN ROUNDRECT
    // ================================================================
    function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
    }
    
    // ================================================================
    //  DIBUJAR PÚA
    // ================================================================
    function drawSpike(x, y, w, h) {
        ctx.shadowBlur = 20;
        ctx.shadowColor = 'rgba(255,0,0,0.5)';
        
        const grad = ctx.createLinearGradient(x, y, x, y + h);
        grad.addColorStop(0, '#ff4757');
        grad.addColorStop(0.5, '#e94560');
        grad.addColorStop(1, '#c23152');
        ctx.fillStyle = grad;
        
        ctx.beginPath();
        ctx.moveTo(x, y + h);
        const points = 7;
        for (let i = 0; i <= points; i++) {
            const px = x + (i / points) * w;
            const py = (i % 2 === 0) ? y : y + h;
            ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(255,100,100,0.3)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x, y + h);
        for (let i = 0; i <= points; i++) {
            const px = x + (i / points) * w;
            const py = (i % 2 === 0) ? y : y + h;
            ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.stroke();
    }
    
    // ================================================================
    //  FONDOS
    // ================================================================
    function drawBackground(level) {
        const theme = level.theme;
        const bg = theme.bg || 'forest';
        
        const colors = {
            forest: {top: '#0d1f2d', mid: '#1a3a2a', bottom: '#0a1a15'},
            desert: {top: '#2a1a0a', mid: '#4a2a1a', bottom: '#1a0a05'},
            tundra: {top: '#0a1a2a', mid: '#1a2a3a', bottom: '#0a1520'},
            volcano: {top: '#1a0505', mid: '#3a0a0a', bottom: '#0a0202'},
            space: {top: '#05050a', mid: '#0a0a2a', bottom: '#050515'}
        };
        
        const c = colors[bg] || colors.forest;
        
        const grad = ctx.createLinearGradient(0, 0, 0, H);
        grad.addColorStop(0, c.top);
        grad.addColorStop(0.5, c.mid);
        grad.addColorStop(1, c.bottom);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);
        
        switch(bg) {
            case 'forest': drawForest(); break;
            case 'desert': drawDesert(); break;
            case 'tundra': drawTundra(); break;
            case 'volcano': drawVolcano(); break;
            case 'space': drawSpace(); break;
        }
    }
    
    function drawForest() {
        for (let i = 0; i < 15; i++) {
            const x = (i * 67 + 20) % W;
            const h = 40 + (i % 5) * 20;
            ctx.fillStyle = `rgba(30,80,40,${0.05 + (i % 3) * 0.02})`;
            ctx.fillRect(x, H - h, 8, h);
            ctx.beginPath();
            ctx.arc(x + 4, H - h, 15 + (i % 10), 0, Math.PI * 2);
            ctx.fill();
        }
    }
    
    function drawDesert() {
        for (let i = 0; i < 20; i++) {
            const x = (i * 47 + 10) % W;
            const h = 10 + (i % 8) * 8;
            ctx.fillStyle = `rgba(200,150,80,${0.03 + (i % 5) * 0.015})`;
            ctx.beginPath();
            ctx.moveTo(x, H - 5);
            ctx.quadraticCurveTo(x + 15, H - 5 - h, x + 30, H - 5);
            ctx.fill();
        }
        const grad = ctx.createRadialGradient(750, 60, 20, 750, 60, 120);
        grad.addColorStop(0, 'rgba(255,200,100,0.2)');
        grad.addColorStop(1, 'rgba(255,200,100,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(630, 0, 240, 180);
        ctx.fillStyle = 'rgba(255,200,100,0.08)';
        ctx.beginPath();
        ctx.arc(750, 60, 40, 0, Math.PI * 2);
        ctx.fill();
    }
    
    function drawTundra() {
        for (let i = 0; i < 30; i++) {
            const x = (i * 33 + 15 + frameCount * 0.2) % W;
            const y = (i * 47 + 20 + frameCount * 0.1) % H;
            ctx.fillStyle = `rgba(255,255,255,${0.03 + (i % 5) * 0.01})`;
            ctx.beginPath();
            ctx.arc(x, y, 2 + (i % 3), 0, Math.PI * 2);
            ctx.fill();
        }
        for (let i = 0; i < 5; i++) {
            const x = 100 + i * 180;
            ctx.fillStyle = `rgba(200,220,255,${0.03 + i * 0.01})`;
            ctx.beginPath();
            ctx.moveTo(x, H);
            ctx.lineTo(x + 80, H - 80 - i * 20);
            ctx.lineTo(x + 160, H);
            ctx.fill();
        }
    }
    
    function drawVolcano() {
        for (let i = 0; i < 10; i++) {
            const x = (i * 97 + frameCount * 0.3) % W;
            const y = H - 10 + Math.sin(frameCount * 0.02 + i) * 5;
            ctx.fillStyle = `rgba(255,100,0,${0.05 + (i % 4) * 0.02})`;
            ctx.fillRect(x, y, 15 + (i % 10), 3);
        }
        if (Math.random() < 0.02) {
            particles.push({
                x: Math.random() * W,
                y: -10,
                vx: (Math.random() - 0.5) * 1,
                vy: 0.3 + Math.random() * 0.5,
                life: 2 + Math.random() * 2,
                color: `rgba(100,100,100,${0.1 + Math.random() * 0.2})`,
                size: 2 + Math.random() * 4
            });
        }
    }
    
    function drawSpace() {
        for (let i = 0; i < 80; i++) {
            const x = (i * 137 + 50) % W;
            const y = (i * 251 + 30) % H;
            const s = (i % 3) + 1;
            const a = 0.1 + (i % 5) * 0.05;
            ctx.fillStyle = `rgba(255,255,255,${a})`;
            ctx.fillRect(x, y, s, s);
        }
        for (let i = 0; i < 3; i++) {
            const x = 150 + i * 300;
            const y = 100 + i * 80;
            const grad = ctx.createRadialGradient(x, y, 20, x, y, 150);
            const colors = ['rgba(100,50,200,0.03)', 'rgba(200,50,150,0.03)', 'rgba(50,100,200,0.03)'];
            grad.addColorStop(0, colors[i % 3]);
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(x - 150, y - 150, 300, 300);
        }
    }
    
    // ================================================================
    //  DARKEN COLOR
    // ================================================================
    function darkenColor(color, amount) {
        let r = parseInt(color.slice(1,3), 16);
        let g = parseInt(color.slice(3,5), 16);
        let b = parseInt(color.slice(5,7), 16);
        r = Math.floor(r * (1 - amount));
        g = Math.floor(g * (1 - amount));
        b = Math.floor(b * (1 - amount));
        return `rgb(${r},${g},${b})`;
    }
    
    // ================================================================
    //  CONTROLES
    // ================================================================
    document.addEventListener('keydown', (e) => {
        keys[e.code] = true;
        if (e.code === 'KeyR') resetCurrentLevel();
        if (e.code === 'KeyP') {
            gameRunning = !gameRunning;
            if (!gameRunning) showMessage('⏸️ PAUSA', 500);
            else showMessage('▶️ CONTINUAR', 500);
        }
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
            e.preventDefault();
        }
    });
    
    document.addEventListener('keyup', (e) => {
        keys[e.code] = false;
    });
    
    // --- Controles móviles ---
    function setupMobileControls() {
        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');
        const btnJump = document.getElementById('btnJump');
        
        const addTouch = (el, key) => {
            el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
            el.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
            el.addEventListener('touchcancel', (e) => { keys[key] = false; });
            el.addEventListener('mousedown', () => { keys[key] = true; });
            el.addEventListener('mouseup', () => { keys[key] = false; });
            el.addEventListener('mouseleave', () => { keys[key] = false; });
        };
        
        addTouch(btnLeft, 'left');
        addTouch(btnRight, 'right');
        addTouch(btnJump, 'jump');
    }
    setupMobileControls();
    
    // ================================================================
    //  MENÚ
    // ================================================================
    // Selección de mundo
    document.querySelectorAll('.world-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.world-btn').forEach(b => b.style.borderColor = 'rgba(255,255,255,0.1)');
            btn.style.borderColor = '#e94560';
            selectedWorld = parseInt(btn.dataset.world);
        });
    });
    document.querySelector('.world-btn').style.borderColor = '#e94560';
    
    // Personalización
    document.querySelectorAll('.custom-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const custom = btn.dataset.custom;
            const value = btn.dataset.value;
            
            document.querySelectorAll(`.custom-btn[data-custom="${custom}"]`).forEach(b => {
                b.classList.remove('active');
            });
            btn.classList.add('active');
            
            customization[custom] = value;
        });
    });
    
    // Iniciar juego
    menuStartBtn.addEventListener('click', () => {
        currentWorld = selectedWorld;
        currentLevelInWorld = 0;
        hearts = MAX_HEARTS;
        totalDeaths = 0;
        showMenu = false;
        menuOverlay.classList.add('hidden');
        initLevel();
    });
    
    // Botón menú durante el juego
    menuBtn.addEventListener('click', () => {
        showMenu = true;
        menuOverlay.classList.remove('hidden');
        gameRunning = false;
    });
    
    // ================================================================
    //  BOTONES
    // ================================================================
    document.getElementById('restartBtn').addEventListener('click', resetCurrentLevel);
    document.getElementById('resetGameBtn').addEventListener('click', resetFullGame);
    
    document.getElementById('prevWorldBtn').addEventListener('click', () => {
        if (currentWorld > 0) {
            currentWorld--;
            currentLevelInWorld = 0;
            hearts = MAX_HEARTS;
            initLevel();
            showMessage(`🌍 Mundo ${currentWorld + 1}`, 1000);
        }
    });
