            </div>
        </div>
        
        <canvas id="gameCanvas" width="1200" height="550"></canvas>
        
        <div id="messageOverlay">
            <div id="messageText"></div>
        </div>
        
        <div id="mobileControls">
            <div class="mobile-dpad">
                <div class="mobile-btn" id="btnLeft">◀</div>
                <div class="mobile-btn" id="btnRight">▶</div>
            </div>
            <div class="mobile-btn jump-btn" id="btnJump">▲<br><span style="font-size:8px;">SALTAR</span></div>
        </div>
        
        <div id="bottomUI">
            <button id="restartBtn">🔄 Reiniciar</button>
            <button id="prevWorldBtn">◀ Mundo</button>
            <button id="nextWorldBtn">Mundo ▶</button>
            <button id="prevLevelBtn">◀ Nivel</button>
            <button id="nextLevelBtn">Nivel ▶</button>
            <button id="resetGameBtn" class="btn-primary">✨ Nuevo Juego</button>
        </div>
        
        <div class="key-hint">PC: ← → Moverse | ↑ Saltar | R Reiniciar | Móvil: Botones táctiles</div>
    </div>
</div>

<script>
    // ================================================================
    //  DEVIL'S ASCENT - EDICIÓN DEFINITIVA
    //  - Niveles más largos con scroll horizontal
    //  - Más obstáculos lógicos
    //  - Paisajes dinámicos que cambian cada nivel
    // ================================================================
    
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const W = 1200; // Canvas más ancho para scroll
    const H = 550;
    
    // Sistema de cámara
    let cameraX = 0;
    const LEVEL_WIDTH = 2400; // Niveles más largos
    
    const menuOverlay = document.getElementById('menuOverlay');
    const menuStartBtn = document.getElementById('menuStartBtn');
    const menuBtn = document.getElementById('menuBtn');
    const worldDisplay = document.getElementById('worldDisplay');
    const levelDisplay = document.getElementById('levelDisplay');
    const maxLevelDisplay = document.getElementById('maxLevelDisplay');
    const heartsDisplay = document.getElementById('heartsDisplay');
    const timerDisplay = document.getElementById('timerDisplay');
    const deathsDisplay = document.getElementById('deathsDisplay');
    const difficultyDisplay = document.getElementById('difficultyDisplay');
    const messageText = document.getElementById('messageText');
    
    const GRAVITY = 0.55;
    const FRICTION = 0.88;
    const PLAYER_SPEED = 4.2;
    const JUMP_FORCE = -10.5;
    const MAX_HEARTS = 3;
    const TOTAL_WORLDS = 5;
    const LEVELS_PER_WORLD = 50;
    
    const customization = {
        color: 'blue',
        hat: 'none',
        accessory: 'none',
        extra: 'none'
    };
    
    const colorMap = {
        blue: { body: '#4fc3f7', bodyDark: '#0288d1', skin: '#ffccbc', accent: '#e94560' },
        red: { body: '#ff6b6b', bodyDark: '#c0392b', skin: '#ffccbc', accent: '#f39c12' },
        green: { body: '#6bcb77', bodyDark: '#27ae60', skin: '#ffccbc', accent: '#f1c40f' },
        purple: { body: '#a855f7', bodyDark: '#7c3aed', skin: '#ffccbc', accent: '#ec4899' },
        gold: { body: '#fbbf24', bodyDark: '#d97706', skin: '#ffccbc', accent: '#e94560' },
        pink: { body: '#f472b6', bodyDark: '#db2777', skin: '#ffccbc', accent: '#8b5cf6' },
        cyan: { body: '#22d3ee', bodyDark: '#0891b2', skin: '#ffccbc', accent: '#f472b6' },
        orange: { body: '#fb923c', bodyDark: '#ea580c', skin: '#ffccbc', accent: '#e94560' }
    };
    
    let currentWorld = 0;
    let currentLevelInWorld = 0;
    let hearts = MAX_HEARTS;
    let totalDeaths = 0;
    let gameTime = 0;
    let gameRunning = true;
    let levelComplete = false;
    let deathAnimation = false;
    let particles = [];
    let frameCount = 0;
    let messageTimeout = null;
    let comboCount = 0;
    let showMenu = true;
    let selectedWorld = 0;
    let levelTransitioning = false;
    let nextLevelTimer = 0;
    
    const keys = {};
    
    const player = {
        x: 60, y: 400, w: 30, h: 46,
        vx: 0, vy: 0,
        onGround: false,
        facing: 1,
        jumping: false,
        walkFrame: 0,
        walkTimer: 0,
        hurtTimer: 0,
        invincible: false,
        invincibleTimer: 0,
        armAngle: 0
    };
    
    let levels = [];
    let levelState = {};
    
    // ================================================================
    //  GENERADOR DE NIVELES MEJORADO
    // ================================================================
    function generateAllLevels() {
        levels = [];
        
        // Paletas de colores dinámicas para cada nivel
        const worldThemes = [];
        
        // Bosque - Verdes y marrones
        for (let i = 0; i < 10; i++) {
            worldThemes.push({
                name: '🌲 Bosque', bg: 'forest', 
                color: `hsl(${100 + i * 5}, 40%, ${20 + i * 3}%)`,
                trapColor: '#e94560', 
                platformColor: `hsl(${110 + i * 3}, 45%, ${25 + i * 2}%)`,
                skyColor: `hsl(${190 + i * 5}, 60%, ${15 + i * 4}%)`
            });
        }
        
        // Desierto - Naranjas y rojos
        for (let i = 0; i < 10; i++) {
            worldThemes.push({
                name: '🏜️ Desierto', bg: 'desert', 
                color: `hsl(${30 + i * 4}, 60%, ${15 + i * 3}%)`,
                trapColor: '#ff6b35', 
                platformColor: `hsl(${35 + i * 3}, 55%, ${30 + i * 2}%)`,
                skyColor: `hsl(${25 + i * 3}, 70%, ${20 + i * 3}%)`
            });
        }
        
        // Tundra - Azules y blancos
        for (let i = 0; i < 10; i++) {
            worldThemes.push({
                name: '❄️ Tundra', bg: 'tundra', 
                color: `hsl(${200 + i * 4}, 50%, ${15 + i * 3}%)`,
                trapColor: '#4fc3f7', 
                platformColor: `hsl(${180 + i * 3}, 40%, ${30 + i * 2}%)`,
                skyColor: `hsl(${210 + i * 3}, 60%, ${20 + i * 3}%)`
            });
        }
        
        // Volcán - Rojos y negros
        for (let i = 0; i < 10; i++) {
            worldThemes.push({
                name: '🌋 Volcán', bg: 'volcano', 
                color: `hsl(${0 + i * 3}, 70%, ${10 + i * 2}%)`,
                trapColor: '#ff4757', 
                platformColor: `hsl(${10 + i * 2}, 65%, ${25 + i * 2}%)`,
                skyColor: `hsl(${350 + i * 3}, 75%, ${15 + i * 2}%)`
            });
        }
        
        // Espacio - Morados y azules
        for (let i = 0; i < 10; i++) {
            worldThemes.push({
                name: '🌌 Espacio', bg: 'space', 
                color: `hsl(${250 + i * 5}, 50%, ${10 + i * 2}%)`,
                trapColor: '#a855f7', 
                platformColor: `hsl(${220 + i * 4}, 45%, ${25 + i * 2}%)`,
                skyColor: `hsl(${260 + i * 4}, 55%, ${15 + i * 2}%)`
            });
        }
        
        for (let w = 0; w < TOTAL_WORLDS; w++) {
            for (let lv = 0; lv < LEVELS_PER_WORLD; lv++) {
                const levelNum = lv + 1;
                const difficulty = Math.min(3, Math.floor(levelNum / 12));
                const themeIndex = w * 10 + Math.floor(lv / 5);
                const theme = worldThemes[themeIndex] || worldThemes[0];
                const level = generateLevel(w, lv, difficulty, theme);
                levels.push(level);
            }
        }
    }
    
    function generateLevel(world, levelIndex, difficulty, theme) {
        const levelNum = levelIndex + 1;
        const isBossLevel = (levelNum % 10 === 0);
        const isBonusLevel = (levelNum % 5 === 0 && !isBossLevel);
        
        const level = {
            world: world,
            index: levelIndex,
            number: levelNum,
            theme: theme,
            difficulty: difficulty,
            isBossLevel: isBossLevel,
            isBonusLevel: isBonusLevel,
            platforms: [],
            traps: [],
            spikes: [],
            movingPlatforms: [],
            fallingPlatforms: [],
            rotatingObstacles: [],
            enemies: [],
            collectibles: [],
            checkpoints: [],
            goal: {x: LEVEL_WIDTH - 80, y: 470, w: 40, h: 40},
            playerStart: {x: 50, y: 470},
            specialEffects: [],
            darkMode: false,
            fireParticles: false,
            invertedGravity: false,
            wind: 0,
            name: generateLevelName(world, levelNum, isBossLevel, isBonusLevel),
            starRating: Math.min(5, 1 + difficulty + Math.floor(levelNum / 15))
        };
        
        // === PLATAFORMA BASE (con huecos) ===
        for (let x = 0; x < LEVEL_WIDTH; x += 120) {
            // Crear huecos en el suelo para más dificultad
            if (Math.random() > 0.15 || x < 200) {
                const gapWidth = 80 + Math.random() * 60;
                if (x + gapWidth < LEVEL_WIDTH - 100) {
                    level.platforms.push({x: x, y: 510, w: gapWidth, h: 40, type: 'solid'});
                }
            }
        }
        
        // === PLATAFORMAS FLOTANTES ===
        const numPlatforms = 8 + difficulty * 3 + Math.floor(levelNum / 5);
        let lastX = 100;
        let lastY = 470;
        
        for (let i = 0; i < numPlatforms; i++) {
            const pWidth = 50 + Math.random() * 60 + (isBonusLevel ? 30 : 0);
            const pX = lastX + 100 + Math.random() * 60;
            const pY = Math.max(80, lastY - (50 + Math.random() * 60));
            
            let type = 'solid';
            const rand = Math.random();
            
            if (difficulty >= 1 && rand < 0.15 + difficulty * 0.08) {
                type = 'moving';
            } else if (difficulty >= 2 && rand > 0.75 && rand < 0.85) {
                type = 'falling';
            } else if (difficulty >= 1 && rand > 0.85 && rand < 0.92) {
                type = 'bouncy';
            }
            
            const platform = {x: pX, y: pY, w: pWidth, h: 18, type: type};
            
            if (type === 'moving') {
                platform.moveX = 80 + Math.random() * 120;
                platform.speed = 0.5 + Math.random() * 1.5;
                platform.phase = Math.random() * Math.PI * 2;
                level.movingPlatforms.push(platform);
            } else if (type === 'falling') {
                platform.fallDelay = Math.max(10, 30 - difficulty * 5);
                level.fallingPlatforms.push(platform);
            }
            
            level.platforms.push(platform);
            lastX = pX + pWidth;
            lastY = pY;
        }
        
        // === OBSTÁCULOS ROTATORIOS ===
        if (difficulty >= 2) {
            const numRotating = 1 + Math.floor(levelNum / 15);
            for (let i = 0; i < numRotating; i++) {
                const rx = 400 + i * 300 + Math.random() * 100;
                const ry = 350 + Math.random() * 100;
                level.rotatingObstacles.push({
                    x: rx, y: ry,
                    radius: 30 + Math.random() * 20,
                    angle: Math.random() * Math.PI * 2,
                    speed: 0.02 + Math.random() * 0.03
                });
            }
        }
        
        // === ENEMIGOS SIMPLES ===
        if (difficulty >= 1) {
            const numEnemies = 1 + Math.floor(levelNum / 10);
            for (let i = 0; i < numEnemies; i++) {
                const ex = 500 + i * 200 + Math.random() * 150;
                const ey = 480 + Math.random() * 20;
                level.enemies.push({
                    x: ex, y: ey, w: 25, h: 25,
                    vx: 1 + Math.random() * 2,
                    range: 60 + Math.random() * 40,
                    origX: ex
                });
            }
        }
        
        // === COLECCIONABLES (monedas) ===
        if (!isBossLevel) {
            const numCoins = 5 + Math.floor(levelNum / 5);
            for (let i = 0; i < numCoins; i++) {
                const cx = 300 + i * 180 + Math.random() * 50;
                const cy = 400 + Math.random() * 80;
                level.collectibles.push({x: cx, y: cy, w: 20, h: 20, collected: false});
            }
        }
        
        // === CHECKPOINTS ===
        if (levelNum > 3 && levelNum % 4 === 0) {
            const cpX = LEVEL_WIDTH * 0.5;
            level.checkpoints.push({x: cpX, y: 470, w: 30, h: 40, activated: false});
        }
        
        // === PÚAS FIJAS ===
        const numSpikes = 5 + difficulty * 3 + Math.floor(levelNum / 6);
        for (let i = 0; i < Math.min(numSpikes, 25); i++) {
            let spikeX = 100 + Math.random() * (LEVEL_WIDTH - 200);
            let spikeY;
            
            if (Math.random() < 0.7) {
                spikeY = 490 + Math.random() * 15;
            } else {
                const p = level.platforms[Math.floor(Math.random() * level.platforms.length)];
                if (p && p.y > 350 && p.y < 500 && p.w > 40) {
                    spikeX = p.x + 15 + Math.random() * (p.w - 30);
                    spikeY = p.y - 16;
                } else {
                    spikeY = 490 + Math.random() * 10;
                }
            }
            
            let valid = true;
            for (const s of level.spikes) {
                if (Math.abs(s.x - spikeX) < 30) { valid = false; break; }
            }
            if (spikeX > LEVEL_WIDTH - 150) valid = false;
            
            if (valid) {
                level.spikes.push({ x: spikeX, y: spikeY, w: 22, h: 16, type: 'spike' });
            }
        }
        
        // === TRAMPAS ACTIVAS ===
        const numTraps = 3 + difficulty * 2 + Math.floor(levelNum / 8);
        for (let i = 0; i < Math.min(numTraps, 15); i++) {
            const trapX = 150 + Math.random() * (LEVEL_WIDTH - 300);
            let trapY = 490 + Math.random() * 10;
            
            for (const p of level.platforms) {
                if (trapX > p.x + 10 && trapX < p.x + p.w - 20 && p.y > 400) {
                    trapY = p.y - 16;
                    break;
                }
            }
            
            const trapType = Math.random() < 0.4 ? 'spike' : 'laser';
            level.traps.push({
                x: trapX,
                y: trapY,
                w: 26 + Math.random() * 28,
                h: 18,
                type: trapType,
                active: true,
                pattern: Math.random() < 0.5 ? 'pulse' : 'sweep',
                phase: Math.random() * Math.PI * 2,
                speed: 1.0 + Math.random() * 2.5 + difficulty * 0.2
            });
        }
        
        // === NIVELES JEFE ===
        if (isBossLevel) {
            level.bossMode = true;
            for (let i = 0; i < 8 + difficulty * 3; i++) {
                level.traps.push({
                    x: 100 + i * 140,
                    y: 490,
                    w: 35,
                    h: 18,
                    type: 'laser',
                    active: true,
                    pattern: 'sweep',
                    phase: i * 0.15,
                    speed: 2 + Math.random() * 1
                });
            }
            for (let i = 0; i < 12 + difficulty * 3; i++) {
                level.spikes.push({
                    x: 80 + i * 100,
                    y: 490,
                    w: 22,
                    h: 16,
                    type: 'spike'
                });
            }
            level.goal.x = LEVEL_WIDTH - 60;
        }
        
        // === NIVELES BONUS ===
        if (isBonusLevel && !isBossLevel) {
            level.bonusMode = true;
            level.goal.x = LEVEL_WIDTH - 60;
            level.specialEffects.push({type: 'stars', count: 10 + Math.random() * 15});
        }
        
        return level;
    }
    
    function generateLevelName(world, num, isBoss, isBonus) {
        const worldNames = ['Bosque', 'Desierto', 'Tundra', 'Volcán', 'Espacio'];
        const prefixes = ['Camino', 'Sendero', 'Cueva', 'Pico', 'Valle', 'Cascada', 'Abismo', 'Cumbre', 'Cañón', 'Cráter', 'Ruta', 'Travesía'];
        const suffixes = ['del Alba', 'del Crepúsculo', 'de la Muerte', 'del Fuego', 'del Hielo', 'de la Luz', 'de la Sombra', 'del Viento', 'del Trueno', 'del Silencio', 'Perdido', 'Olvidado'];
        
        if (isBoss) return `👑 JEFE: ${worldNames[world]} ${num}`;
        if (isBonus) return `⭐ BONUS: ${worldNames[world]} ${num}`;
        
        const p = prefixes[num % prefixes.length];
        const s = suffixes[(num * 2) % suffixes.length];
        return `${p} ${s}`;
    }
    
    // ================================================================
    //  INICIALIZAR NIVEL
    // ================================================================
    function initLevel() {
        const levelIndex = currentWorld * LEVELS_PER_WORLD + currentLevelInWorld;
        const level = levels[levelIndex];
        if (!level) {
            if (currentWorld < TOTAL_WORLDS - 1) {
                currentWorld++;
                currentLevelInWorld = 0;
                initLevel();
            }
            return;
        }
        
        player.x = level.playerStart.x || 50;
        player.y = level.playerStart.y || 470;
        player.vx = 0;
        player.vy = 0;
        player.onGround = false;
        player.invincible = false;
        player.invincibleTimer = 0;
        player.hurtTimer = 0;
        levelTransitioning = false;
        nextLevelTimer = 0;
        cameraX = 0;
        
        levelState = {
            movingPlatforms: [],
            fallingPlatforms: [],
            trapTimers: {},
            platformStates: {},
            specialParticles: [],
            enemyStates: []
        };
        
        level.movingPlatforms.forEach((p, idx) => {
            levelState.movingPlatforms.push({
                index: idx,
                origX: p.x,
                origY: p.y,
                phase: p.phase || 0,
                timer: Math.random() * 100
            });
        });
        
        level.fallingPlatforms.forEach((p, idx) => {
            levelState.fallingPlatforms.push({
                index: idx,
                origX: p.x,
                origY: p.y,
                timer: 0,
                falling: false,
                fallSpeed: 0,
                resetTimer: 0
            });
        });
        
        level.traps.forEach((trap, idx) => {
            levelState.trapTimers[idx] = Math.random() * 100;
        });
        
        level.enemies.forEach((enemy, idx) => {
            levelState.enemyStates.push({
                origX: enemy.x,
                timer: Math.random() * 100
            });
        });
        
        level.collectibles.forEach(c => c.collected = false);
        level.checkpoints.forEach(c => c.activated = false);
        
        gameTime = 0;
        levelComplete = false;
        deathAnimation = false;
        particles = [];
        
        updateUI();
        
        const levelNum = currentLevelInWorld + 1;
        const worldNum = currentWorld + 1;
        const stars = '⭐'.repeat(Math.min(5, level.starRating || 1));
        let msg = `🌍 Mundo ${worldNum} - Nivel ${levelNum} ${stars}`;
        if (level.isBossLevel) msg = `👑 ${level.name} ${stars}`;
        else if (level.isBonusLevel) msg = `⭐ ${level.name} ${stars}`;
        else msg = `${level.name} ${stars}`;
        
        showMessage(msg, 1800);
        gameRunning = true;
    }
    
    // ================================================================
    //  ACTUALIZAR UI
    // ================================================================
    function updateUI() {
        const worldNum = currentWorld + 1;
        const levelNum = currentLevelInWorld + 1;
        const level = levels[currentWorld * LEVELS_PER_WORLD + currentLevelInWorld];
        
        worldDisplay.textContent = `Mundo ${worldNum}`;
        levelDisplay.textContent = levelNum;
        maxLevelDisplay.textContent = LEVELS_PER_WORLD;
        
        if (level) {
            const stars = '⭐'.repeat(Math.min(5, level.starRating || 1));
            difficultyDisplay.textContent = stars;
        }
        
        let heartsStr = '';
        for (let i = 0; i < MAX_HEARTS; i++) {
            heartsStr += i < hearts ? '❤️' : '🖤';
        }
        heartsDisplay.textContent = heartsStr;
        
        timerDisplay.textContent = Math.floor(gameTime);
        deathsDisplay.textContent = totalDeaths;
    }
    
    function showMessage(text, duration = 2000) {
        messageText.textContent = text;
        messageText.classList.add('show');
        clearTimeout(messageTimeout);
        messageTimeout = setTimeout(() => {
            messageText.classList.remove('show');
        }, duration);
    }
    
    function rectCollide(a, b) {
        return a.x < b.x + b.w && 
               a.x + a.w > b.x &&
               a.y < b.y + b.h && 
               a.y + a.h > b.y;
    }
    
    // ================================================================
    //  ACTUALIZACIÓN DEL JUEGO
    // ================================================================
    function update() {
        if (!gameRunning || deathAnimation || levelComplete || showMenu || levelTransitioning) return;
        
        const levelIndex = currentWorld * LEVELS_PER_WORLD + currentLevelInWorld;
        const level = levels[levelIndex];
        if (!level) return;
        
        frameCount++;
        gameTime += 1/60;
        
        if (player.invincible) {
            player.invincibleTimer--;
            if (player.invincibleTimer <= 0) player.invincible = false;
        }
        
        // Gravedad
        if (level.invertedGravity) {
            player.vy -= GRAVITY * 0.7;
        } else {
            player.vy += GRAVITY;
        }
        
        if (level.wind) {
            player.vx += level.wind * 0.1;
        }
        
        // Movimiento
        let moveX = 0;
        if (keys['ArrowLeft'] || keys['KeyA'] || keys['left']) moveX = -1;
        if (keys['ArrowRight'] || keys['KeyD'] || keys['right']) moveX = 1;
        
        player.vx += moveX * 0.7;
        player.vx *= FRICTION;
        const maxSpeed = PLAYER_SPEED + (level.wind ? Math.abs(level.wind) * 2 : 0);
        if (Math.abs(player.vx) > maxSpeed) {
            player.vx = maxSpeed * Math.sign(player.vx);
        }
        
        // Salto
        const jumpKey = keys['ArrowUp'] || keys['KeyW'] || keys['Space'] || keys['jump'];
        if (jumpKey && player.onGround) {
            player.vy = JUMP_FORCE;
            player.onGround = false;
            player.jumping = true;
            for (let i = 0; i < 6; i++) {
                particles.push({
                    x: player.x + player.w/2 + (Math.random() - 0.5) * 20,
                    y: player.y + player.h,
                    vx: (Math.random() - 0.5) * 2.5,
                    vy: -Math.random() * 2.5,
                    life: 0.5 + Math.random() * 0.3,
                    color: 'rgba(200,200,255,0.4)',
                    size: 3 + Math.random() * 3
                });
            }
        }
        
        if (player.jumping && !jumpKey) {
            if (player.vy < -3) player.vy = -3;
            player.jumping = false;
        }
        
        // Animación
        if (Math.abs(player.vx) > 0.5 && player.onGround) {
            player.walkTimer += Math.abs(player.vx) * 0.05;
            if (player.walkTimer > 1) {
                player.walkTimer = 0;
                player.walkFrame = (player.walkFrame + 1) % 4;
            }
        } else if (player.onGround) {
            player.walkFrame = 0;
            player.walkTimer = 0;
        }
        
        if (moveX > 0) player.facing = 1;
        else if (moveX < 0) player.facing = -1;
        
        if (!player.onGround) {
            player.armAngle += 0.08;
        } else if (Math.abs(player.vx) > 0.5) {
            player.armAngle += 0.05 * Math.sign(player.vx);
        }
        
        // Movimiento horizontal
        player.x += player.vx;
        
        // Limitar al nivel
        if (player.x < 0) player.x = 0;
        if (player.x + player.w > LEVEL_WIDTH) player.x = LEVEL_WIDTH - player.w;
        
        // Actualizar cámara
        cameraX = Math.max(0, Math.min(player.x - W * 0.3, LEVEL_WIDTH - W));
        
        for (const p of level.platforms) {
            let px = p.x, py = p.y;
            const movingIdx = level.movingPlatforms.indexOf(p);
            if (movingIdx !== -1) {
                const state = levelState.movingPlatforms.find(s => s.index === movingIdx);
                if (state) {
                    px = state.origX + Math.sin(state.timer * p.speed + state.phase) * (p.moveX || 0);
                }
            }
            const fallingIdx = level.fallingPlatforms.indexOf(p);
            if (fallingIdx !== -1) {
                const state = levelState.fallingPlatforms.find(s => s.index === fallingIdx);
                if (state && state.falling) {
                    py = state.origY + state.fallSpeed;
                }
            }
            
            if (rectCollide(player, {x: px, y: py, w: p.w, h: p.h})) {
                if (player.vx > 0) {
                    player.x = px - player.w;
                } else if (player.vx < 0) {
                    player.x = px + p.w;
                }
                player.vx = 0;
            }
        }
        
        // Movimiento vertical
        player.y += player.vy;
        player.onGround = false;
        
        for (const p of level.platforms) {
            let px = p.x, py = p.y;
            const movingIdx = level.movingPlatforms.indexOf(p);
            if (movingIdx !== -1) {
                const state = levelState.movingPlatforms.find(s => s.index === movingIdx);
                if (state) {
                    px = state.origX + Math.sin(state.timer * p.speed + state.phase) * (p.moveX || 0);
                }
            }
            const fallingIdx = level.fallingPlatforms.indexOf(p);
            if (fallingIdx !== -1) {
                const state = levelState.fallingPlatforms.find(s => s.index === fallingIdx);
                if (state && state.falling) {
                    py = state.origY + state.fallSpeed;
                }
            }
            
            if (rectCollide(player, {x: px, y: py, w: p.w, h: p.h})) {
                if (player.vy > 0) {
                    player.y = py - player.h;
                    player.vy = 0;
                    player.onGround = true;
                    
                    // Plataformas elásticas
                    if (p.type === 'bouncy') {
                        player.vy = JUMP_FORCE * 1.5;
                    }
                } else if (player.vy < 0) {
                    player.y = py + p.h;
                    player.vy = 0;
                }
            }
        }
        
        // Actualizar plataformas móviles
        for (const state of levelState.movingPlatforms) {
            state.timer += 0.025;
        }
        
        // Actualizar plataformas que caen
        for (const state of levelState.fallingPlatforms) {
            const p = level.platforms[level.platforms.indexOf(level.fallingPlatforms[state.index])];
            if (!p) continue;
            
            if (state.falling) {
                state.fallSpeed += 0.4;
                if (state.fallSpeed > 12) state.fallSpeed = 12;
                state.resetTimer++;
                if (state.resetTimer > 100) {
                    state.falling = false;
                    state.fallSpeed = 0;
                    state.resetTimer = 0;
                }
            } else {
                state.timer++;
                if (state.timer > (p.fallDelay || 50)) {
                    const px = p.x;
                    const py = p.y;
                    if (player.x + player.w > px && player.x < px + p.w &&
                        player.y + player.h >= py && player.y + player.h <= py + p.h + 5) {
                        state.falling = true;
                        state.timer = 0;
                    }
                }
            }
        }
        
        // Actualizar obstáculos rotatorios
        for (const obstacle of level.rotatingObstacles) {
            obstacle.angle += obstacle.speed;
            
            // Colisión con el jugador
            if (!player.invincible) {
                const dx = player.x + player.w/2 - obstacle.x;
                const dy = player.y + player.h/2 - obstacle.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < obstacle.radius + player.w/2) {
                    playerHit();
                }
            }
        }
        
        // Actualizar enemigos
        for (let i = 0; i < level.enemies.length; i++) {
            const enemy = level.enemies[i];
            const state = levelState.enemyStates[i];
            if (!state) continue;
            
            state.timer += 0.02;
            enemy.x = state.origX + Math.sin(state.timer) * enemy.range;
            
            if (!player.invincible && rectCollide(player, enemy)) {
                playerHit();
            }
        }
        
        // Recoger coleccionables
        for (const collectible of level.collectibles) {
            if (!collectible.collected && rectCollide(player, collectible)) {
                collectible.collected = true;
                comboCount += 0.5;
                for (let i = 0; i < 20; i++) {
                    particles.push({
                        x: collectible.x + collectible.w/2,
                        y: collectible.y + collectible.h/2,
                        vx: (Math.random() - 0.5) * 6,
                        vy: (Math.random() - 0.5) * 6 - 2,
                        life: 0.8 + Math.random() * 0.4,
                        color: `hsl(${Math.random() * 360}, 100%, 60%)`,
                        size: 4 + Math.random() * 4
                    });
                }
                showMessage('💰 +1 Moneda', 500);
            }
        }
        
        // Activar checkpoints
        for (const checkpoint of level.checkpoints) {
            if (!checkpoint.activated && rectCollide(player, checkpoint)) {
                checkpoint.activated = true;
                level.playerStart.x = checkpoint.x;
                level.playerStart.y = checkpoint.y;
                showMessage('💾 ¡Checkpoint Activado!', 1000);
            }
        }
        
        // Colisiones con púas fijas
        if (!player.invincible) {
            for (const spike of level.spikes) {
                if (rectCollide(player, spike)) {
                    playerHit();
                    break;
                }
            }
            
            // Colisiones con trampas activas
            for (let i = 0; i < level.traps.length; i++) {
                const trap = level.traps[i];
                if (!trap.active) continue;
                
                levelState.trapTimers[i] = (levelState.trapTimers[i] || 0) + 0.025;
                const timer = levelState.trapTimers[i];
                
                let active = false;
                if (trap.pattern === 'pulse') {
                    active = Math.sin(timer * 3 * trap.speed) > 0.15;
                } else if (trap.pattern === 'sweep') {
                    const phase = trap.phase || 0;
                    active = Math.sin(timer * 2 * trap.speed + phase * Math.PI * 2) > 0.25;
                }
                
                if (active) {
                    let trapRect = {...trap};
                    if (trap.type === 'laser') {
                        trapRect.h = 10;
                        trapRect.y += 12;
                        trapRect.w = trap.w + 10;
                    }
                    if (rectCollide(player, trapRect)) {
                        playerHit();
                        break;
                    }
                }
            }
        }
        
        // COLISIÓN CON LA META
        if (!levelTransitioning) {
            const goal = level.goal;
            const detectionPadding = 10;
            
            const playerRect = {
                x: player.x - detectionPadding,
                y: player.y - detectionPadding,
                w: player.w + detectionPadding * 2,
                h: player.h + detectionPadding * 2
            };
            
            const goalRect = {
                x: goal.x - detectionPadding,
                y: goal.y - detectionPadding,
                w: goal.w + detectionPadding * 2,
                h: goal.h + detectionPadding * 2
            };
            
            if (rectCollide(playerRect, goalRect)) {
                levelTransitioning = true;
                levelComplete = true;
                
                const levelNum = currentLevelInWorld + 1;
                const worldNum = currentWorld + 1;
                
                comboCount++;
                let bonusMsg = '';
                if (comboCount >= 5) bonusMsg = ' 🔥 ¡Racha de 5!';
                if (comboCount >= 10) bonusMsg = ' ⚡ ¡Racha de 10!';
                if (comboCount >= 20) bonusMsg = ' 🌟 ¡Racha de 20!';
                
                for (let i = 0; i < 50; i++) {
                    particles.push({
                        x: goal.x + goal.w/2 + (Math.random() - 0.5) * 50,
                        y: goal.y + goal.h/2 + (Math.random() - 0.5) * 50,
                        vx: (Math.random() - 0.5) * 16,
                        vy: (Math.random() - 0.5) * 16 - 6,
                        life: 1 + Math.random() * 0.6,
                        color: `hsl(${Math.random() * 60 + 20}, 100%, 60%)`,
                        size: 4 + Math.random() * 8
                    });
                }
                
                let nextWorld = currentWorld;
                let nextLevel = currentLevelInWorld + 1;
                
                if (nextLevel >= LEVELS_PER_WORLD) {
                    nextLevel = 0;
                    nextWorld = currentWorld + 1;
                }
                
                if (nextWorld >= TOTAL_WORLDS) {
                    showMessage(`🎉 ¡JUEGO COMPLETADO! 🎉\nMundo ${worldNum} - Nivel ${levelNum}${bonusMsg}`, 5000);
                    gameRunning = false;
                    updateUI();
                    return;
                }
                
                const nextStars = levels[nextWorld * LEVELS_PER_WORLD + nextLevel]?.starRating || 1;
                const starsStr = '⭐'.repeat(Math.min(5, nextStars));
                
                if (currentLevelInWorld >= LEVELS_PER_WORLD - 1) {
                    showMessage(`🌟 ¡Mundo ${worldNum} Completado! 🌟\nPasando al Mundo ${nextWorld + 1}\n${starsStr} ${bonusMsg}`, 2500);
                } else {
                    showMessage(`✅ ¡Nivel ${levelNum} Completado! ${starsStr}${bonusMsg}`, 1500);
                }
                
                updateUI();
                
                const delay = currentLevelInWorld >= LEVELS_PER_WORLD - 1 ? 2500 : 1500;
                setTimeout(() => {
                    currentWorld = nextWorld;
                    currentLevelInWorld = nextLevel;
                    hearts = MAX_HEARTS;
                    levelTransitioning = false;
                    initLevel();
                    gameRunning = true;
                }, delay);
                
                return;
            }
        }
        
        // Caer al vacío
        if (player.y > H + 100) {
            playerDie();
        }
        
        updateParticles();
        updateUI();
    }
    
    // ================================================================
    //  GOLPE AL JUGADOR
    // ================================================================
    function playerHit() {
        if (player.invincible || deathAnimation || levelTransitioning) return;
        
        hearts--;
        player.invincible = true;
        player.invincibleTimer = 60;
        player.hurtTimer = 10;
        
        for (let i = 0; i < 15; i++) {
            particles.push({
                x: player.x + player.w/2,
                y: player.y + player.h/2,
                vx: (Math.random() - 0.5) * 6,
                vy: (Math.random() - 0.5) * 6 - 2,
                life: 0.5 + Math.random() * 0.5,
                color: `hsl(${Math.random() * 40 + 340}, 100%, 60%)`,
                size: 3 + Math.random() * 5
            });
        }
        
        if (hearts <= 0) {
            playerDie();
        } else {
            showMessage(`💔 ¡Te hirieron! ${hearts} ❤️ restantes`, 1000);
            updateUI();
        }
    }
    
    // ================================================================
    //  MUERTE DEL JUGADOR
    // ================================================================
    function playerDie() {
        if (deathAnimation || levelTransitioning) return;
        
        deathAnimation = true;
        totalDeaths++;
        comboCount = 0;
        
        for (let i = 0; i < 40; i++) {
            particles.push({
                x: player.x + player.w/2,
                y: player.y + player.h/2,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.5) * 10 - 3,
                life: 0.8 + Math.random() * 0.5,
                color: `hsl(${Math.random() * 60 + 340}, 100%, 50%)`,
                size: 4 + Math.random() * 6
            });
        }
        
        hearts = MAX_HEARTS;
        updateUI();
        showMessage(`💀 ¡Has muerto! (${totalDeaths} muertes)`, 1500);
        
        setTimeout(() => {
            const levelIndex = currentWorld * LEVELS_PER_WORLD + currentLevelInWorld;
            const level = levels[levelIndex];
            if (level) {
                player.x = level.playerStart.x || 50;
                player.y = level.playerStart.y || 470;
                player.vx = 0;
                player.vy = 0;
                player.onGround = false;
                player.invincible = true;
                player.invincibleTimer = 90;
            }
            deathAnimation = false;
            gameRunning = true;
            updateUI();
        }, 800);
    }
    
    // ================================================================
    //  PARTÍCULAS
    // ================================================================
    function updateParticles() {
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.08;
            p.life -= 0.015;
            if (p.life <= 0) {
                particles.splice(i, 1);
            }
        }
    }
    
    // ================================================================
    //  DIBUJO
    // ================================================================
    function draw() {
        const levelIndex = currentWorld * LEVELS_PER_WORLD + currentLevelInWorld;
        const level = levels[levelIndex];
        if (!level) {
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = '#fff';
            ctx.font = '24px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Cargando niveles...', W/2, H/2);
            return;
        }
        
        ctx.clearRect(0, 0, W, H);
        
        // Aplicar transformación de cámara
        ctx.save();
        ctx.translate(-cameraX, 0);
        
        drawBackground(level);
        
        // Plataformas
        for (let i = 0; i < level.platforms.length; i++) {
            const p = level.platforms[i];
            if (p.x > cameraX + W + 100 || p.x + p.w < cameraX - 100) continue;
            
            let px = p.x, py = p.y;
            
            const movingIdx = level.movingPlatforms.indexOf(p);
            if (movingIdx !== -1) {
                const state = levelState.movingPlatforms.find(s => s.index === movingIdx);
                if (state) {
                    px = state.origX + Math.sin(state.timer * p.speed + state.phase) * (p.moveX || 0);
                }
            }
            const fallingIdx = level.fallingPlatforms.indexOf(p);
            if (fallingIdx !== -1) {
                const state = levelState.fallingPlatforms.find(s => s.index === fallingIdx);
                if (state && state.falling) {
                    py = state.origY + state.fallSpeed;
                    ctx.shadowColor = 'rgba(255,50,50,0.4)';
                    ctx.shadowBlur = 20;
                }
            }
            
            let color = level.theme.platformColor || '#4a6fa5';
            if (p.type === 'moving') {
                color = '#6bcb77';
                ctx.shadowBlur = 15;
                ctx.shadowColor = 'rgba(100,255,150,0.3)';
            } else if (p.type === 'falling') {
                color = '#ff6b6b';
                ctx.shadowBlur = 15;
                ctx.shadowColor = 'rgba(255,50,50,0.3)';
            } else if (p.type === 'bouncy') {
                color = '#fbbf24';
                ctx.shadowBlur = 15;
                ctx.shadowColor = 'rgba(255,200,50,0.4)';
            } else {
                ctx.shadowBlur = 8;
                ctx.shadowColor = 'rgba(100,150,255,0.2)';
            }
            
            const grad = ctx.createLinearGradient(px, py, px, py + p.h);
            grad.addColorStop(0, color);
            grad.addColorStop(1, darkenColor(color, 0.4));
            ctx.fillStyle = grad;
            ctx.fillRect(px, py, p.w, p.h);
            ctx.shadowBlur = 0;
            
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.lineWidth = 1;
            ctx.strokeRect(px, py, p.w, p.h);
            
            if (p.type === 'moving') {
                ctx.fillStyle = 'rgba(255,255,255,0.1)';
                ctx.fillRect(px + 5, py + 3, p.w - 10, 4);
            } else if (p.type === 'bouncy') {
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.fillRect(px + 5, py + 3, p.w - 10, 4);
            }
        }
        
        // Púas fijas
        for (const spike of level.spikes) {
            if (spike.x > cameraX + W + 50 || spike.x < cameraX - 50) continue;
            drawSpike(spike.x, spike.y, spike.w, spike.h);
        }
        
        // Trampas activas
        for (let i = 0; i < level.traps.length; i++) {
            const trap = level.traps[i];
            if (trap.x > cameraX + W + 50 || trap.x < cameraX - 50) continue;
            if (!trap.active) continue;
            
            const timer = levelState.trapTimers[i] || 0;
            let active = false;
            
            if (trap.pattern === 'pulse') {
                active = Math.sin(timer * 3 * trap.speed) > 0.15;
            } else if (trap.pattern === 'sweep') {
                const phase = trap.phase || 0;
                active = Math.sin(timer * 2 * trap.speed + phase * Math.PI * 2) > 0.25;
            }
            
            if (trap.type === 'spike' && active) {
                drawSpike(trap.x, trap.y, trap.w, trap.h);
            } else if (trap.type === 'laser' && active) {
                const grad = ctx.createLinearGradient(trap.x, trap.y + 12, trap.x + trap.w, trap.y + 12);
                grad.addColorStop(0, 'rgba(255,0,0,0)');
                grad.addColorStop(0.1, 'rgba(255,0,0,0.9)');
                grad.addColorStop(0.5, 'rgba(255,200,50,0.9)');
                grad.addColorStop(0.9, 'rgba(255,0,0,0.9)');
                grad.addColorStop(1, 'rgba(255,0,0,0)');
                ctx.fillStyle = grad;
                ctx.shadowBlur = 30;
                ctx.shadowColor = 'rgba(255,50,0,0.8)';
                ctx.fillRect(trap.x, trap.y + 12, trap.w + 10, 8);
                ctx.shadowBlur = 0;
            }
        }
        
        // Obstáculos rotatorios
        for (const obstacle of level.rotatingObstacles) {
            if (obstacle.x > cameraX + W + 100 || obstacle.x < cameraX - 100) continue;
            
            ctx.save();
            ctx.translate(obstacle.x, obstacle.y);
            ctx.rotate(obstacle.angle);
            
            ctx.shadowBlur = 20;
            ctx.shadowColor = 'rgba(255,100,0,0.5)';
            ctx.fillStyle = '#ff6b35';
            ctx.fillRect(-obstacle.radius, -5, obstacle.radius * 2, 10);
            ctx.fillStyle = '#ff4757';
            ctx.beginPath();
            ctx.arc(obstacle.radius, 0, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(-obstacle.radius, 0, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            ctx.restore();
        }
        
        // Enemigos
        for (const enemy of level.enemies) {
            if (enemy.x > cameraX + W + 50 || enemy.x < cameraX - 50) continue;
            
            ctx.shadowBlur = 15;
            ctx.shadowColor = 'rgba(255,0,0,0.4)';
            ctx.fillStyle = '#ff4757';
            ctx.fillRect(enemy.x, enemy.y, enemy.w, enemy.h);
            
            // Ojos
            ctx.fillStyle = '#fff';
            ctx.fillRect(enemy.x + 5, enemy.y + 5, 6, 6);
            ctx.fillRect(enemy.x + enemy.w - 11, enemy.y + 5, 6, 6);
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(enemy.x + 7, enemy.y + 7, 3, 3);
            ctx.fillRect(enemy.x + enemy.w - 9, enemy.y + 7, 3, 3);
            
            ctx.shadowBlur = 0;
        }
        
        // Coleccionables
        for (const collectible of level.collectibles) {
            if (collectible.collected) continue;
            if (collectible.x > cameraX + W + 50 || collectible.x < cameraX - 50) continue;
            
            const pulse = Math.sin(frameCount * 0.1) * 3;
            ctx.shadowBlur = 20;
            ctx.shadowColor = 'rgba(255,215,0,0.6)';
            ctx.fillStyle = '#ffd93d';
            ctx.beginPath();
            ctx.arc(collectible.x + collectible.w/2, collectible.y + collectible.h/2 + pulse, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(collectible.x + collectible.w/2, collectible.y + collectible.h/2 + pulse, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }
        
        // Checkpoints
        for (const checkpoint of level.checkpoints) {
            if (checkpoint.x > cameraX + W + 50 || checkpoint.x < cameraX - 50) continue;
            
            const color = checkpoint.activated ? '#4fc3f7' : '#666';
            ctx.shadowBlur = 20;
            ctx.shadowColor = checkpoint.activated ? 'rgba(79,195,247,0.6)' : 'rgba(100,100,100,0.3)';
            ctx.fillStyle = color;
            ctx.fillRect(checkpoint.x, checkpoint.y, checkpoint.w, checkpoint.h);
            
            // Bandera
            ctx.fillStyle = checkpoint.activated ? '#4fc3f7' : '#888';
            ctx.fillRect(checkpoint.x + checkpoint.w/2 - 2, checkpoint.y - 30, 4, 30);
            ctx.fillStyle = checkpoint.activated ? '#fff' : '#aaa';
            ctx.beginPath();
            ctx.moveTo(checkpoint.x + checkpoint.w/2 + 2, checkpoint.y - 30);
            ctx.lineTo(checkpoint.x + checkpoint.w/2 + 20, checkpoint.y - 25);
            ctx.lineTo(checkpoint.x + checkpoint.w/2 + 2, checkpoint.y - 20);
            ctx.fill();
            ctx.shadowBlur = 0;
        }
        
        // Meta
        const goal = level.goal;
        if (goal.x > cameraX - 100 && goal.x < cameraX + W + 100) {
            const pulse = Math.sin(frameCount * 0.06) * 0.3 + 0.7;
            ctx.shadowBlur = 30;
            ctx.shadowColor = `rgba(255,215,0,${0.3 * pulse})`;
            
            ctx.fillStyle = `rgba(255,215,0,${0.15 * pulse})`;
            ctx.fillRect(goal.x - 15, goal.y - 15, goal.w + 30, goal.h + 30);
            
            const grad = ctx.createLinearGradient(goal.x, goal.y, goal.x, goal.y + goal.h);
            grad.addColorStop(0, '#ffd93d');
            grad.addColorStop(0.5, '#f9ca24');
            grad.addColorStop(1, '#f0932b');
            ctx.fillStyle = grad;
            ctx.shadowBlur = 30;
            ctx.shadowColor = `rgba(255,215,0,${0.5 * pulse})`;
            ctx.fillRect(goal.x, goal.y, goal.w, goal.h);
            
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff';
            ctx.font = '28px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('⭐', goal.x + goal.w/2, goal.y + goal.h/2 + 2);
        }
        
        // Jugador
        drawPlayer();
        
        // Partículas
        for (const p of particles) {
            ctx.globalAlpha = Math.max(0, p.life);
            ctx.fillStyle = p.color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = p.color;
            ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
        }
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
        
        ctx.restore();
        
        // Efectos especiales (sin cámara)
        if (level.darkMode) {
            ctx.fillStyle = 'rgba(0,0,0,0.35)';
            ctx.fillRect(0, 0, W, H);
            const grad2 = ctx.createRadialGradient(
                player.x - cameraX + player.w/2, player.y + player.h/2, 20,
                player.x - cameraX + player.w/2, player.y + player.h/2, 200
            );
            grad2.addColorStop(0, 'rgba(255,255,255,0)');
            grad2.addColorStop(1, 'rgba(0,0,0,0.5)');
            ctx.fillStyle = grad2;
            ctx.fillRect(0, 0, W, H);
        }
        
        if (level.fireParticles && Math.random() < 0.1) {
            particles.push({
                x: cameraX + Math.random() * W,
                y: H - 5,
                vx: (Math.random() - 0.5) * 0.5,
                vy: -Math.random() * 1.5 - 0.5,
                life: 0.8 + Math.random() * 0.5,
                color: `hsl(${20 + Math.random() * 30}, 100%, ${40 + Math.random() * 30}%)`,
                size: 3 + Math.random() * 6
            });
        }
        
        if (player.hurtTimer > 0) {
            player.hurtTimer--;
            ctx.fillStyle = `rgba(255,0,0,${player.hurtTimer / 20})`;
            ctx.fillRect(0, 0, W, H);
        }
    }
    
    // ================================================================
    //  DIBUJAR JUGADOR (sin cambios)
    // ================================================================
    function drawPlayer() {
        const p = player;
        if (p.invincible && Math.floor(frameCount / 4) % 2 === 0) return;
        
        const colors = colorMap[customization.color] || colorMap.blue;
        const x = p.x, y = p.y, w = p.w, h = p.h, f = p.facing;
        
        ctx.shadowBlur = 20;
        ctx.shadowColor = 'rgba(79,195,247,0.3)';
        
        // Extra: Efectos
        if (customization.extra === 'glow') {
            ctx.shadowBlur = 40;
            ctx.shadowColor = 'rgba(255,215,0,0.5)';
        } else if (customization.extra === 'fire') {
            ctx.shadowBlur = 40;
            ctx.shadowColor = 'rgba(255,100,0,0.5)';
        } else if (customization.extra === 'ice') {
            ctx.shadowBlur = 40;
            ctx.shadowColor = 'rgba(100,200,255,0.5)';
        } else if (customization.extra === 'electric') {
            ctx.shadowBlur = 40;
            ctx.shadowColor = 'rgba(255,255,0,0.5)';
        } else if (customization.extra === 'rainbow') {
            const hue = (frameCount * 2) % 360;
            ctx.shadowBlur = 40;
            ctx.shadowColor = `hsl(${hue}, 100%, 60%)`;
        } else if (customization.extra === 'shadow') {
            ctx.shadowBlur = 30;
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
        } else if (customization.extra === 'star') {
            ctx.shadowBlur = 40;
            ctx.shadowColor = 'rgba(255,215,0,0.6)';
        }
        
        // Cuerpo
        const bodyGrad = ctx.createLinearGradient(x, y, x + w, y + h);
        bodyGrad.addColorStop(0, colors.body);
        bodyGrad.addColorStop(0.5, colors.body);
        bodyGrad.addColorStop(1, colors.bodyDark);
        ctx.fillStyle = bodyGrad;
        ctx.shadowBlur = 15;
        ctx.shadowColor = 'rgba(79,195,247,0.3)';
        roundRect(ctx, x + 2, y + 12, w - 4, h - 20, 6);
        ctx.fill();
        
        // Cabeza
        ctx.shadowBlur = 10;
        ctx.fillStyle = colors.skin;
        ctx.beginPath();
        ctx.arc(x + w/2, y + 10, 14, 0, Math.PI * 2);
        ctx.fill();
        
        // Ojos
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(x + w/2 - 5 + f * 3, y + 7, 5, 0, Math.PI * 2);
        ctx.arc(x + w/2 + 5 + f * 3, y + 7, 5, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = '#1a1a2e';
        ctx.beginPath();
        ctx.arc(x + w/2 - 4 + f * 4, y + 8, 2.5, 0, Math.PI * 2);
        ctx.arc(x + w/2 + 6 + f * 4, y + 8, 2.5, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.beginPath();
        ctx.arc(x + w/2 - 3 + f * 3, y + 6, 1.2, 0, Math.PI * 2);
        ctx.arc(x + w/2 + 7 + f * 3, y + 6, 1.2, 0, Math.PI * 2);
        ctx.fill();
        
        // Sonrisa
        ctx.strokeStyle = '#1a1a2e';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(x + w/2, y + 12, 5, 0.1, Math.PI - 0.1);
        ctx.stroke();
        
        // Brazos
        ctx.shadowBlur = 5;
        ctx.shadowColor = 'rgba(0,0,0,0.2)';
        ctx.fillStyle = colors.skin;
        
        const armSwing = p.onGround ? Math.sin(p.walkFrame * Math.PI/2) * 6 : -3;
        
        ctx.save();
        ctx.translate(x + 2, y + 16);
        ctx.rotate(-0.3 + armSwing * 0.03 + (p.armAngle * 0.02));
        ctx.fillRect(-2, 0, 5, 14);
        ctx.fillStyle = colors.skin;
        ctx.beginPath();
        ctx.arc(0, 14, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        
        ctx.fillStyle = colors.skin;
        ctx.save();
        ctx.translate(x + w - 2, y + 16);
        ctx.rotate(0.3 - armSwing * 0.03 - (p.armAngle * 0.02));
        ctx.fillRect(-2, 0, 5, 14);
        ctx.fillStyle = colors.skin;
        ctx.beginPath();
        ctx.arc(0, 14, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        
        // Piernas
        ctx.shadowBlur = 5;
        ctx.shadowColor = 'rgba(0,0,0,0.2)';
        ctx.fillStyle = colors.bodyDark;
        
        const legOffset = p.onGround ? Math.sin(p.walkFrame * Math.PI/2) * 5 : Math.sin(frameCount * 0.15) * 3;
        
        ctx.fillRect(x + 4, y + h - 10, 6, 10 + legOffset);
        ctx.fillRect(x + w - 10, y + h - 10, 6, 10 - legOffset);
        
        ctx.fillStyle = colors.accent;
        ctx.fillRect(x + 2, y + h - 2 + legOffset, 10, 4);
        ctx.fillRect(x + w - 12, y + h - 2 - legOffset, 10, 4);
        
        // Sombreros y accesorios (código existente...)
        if (customization.hat !== 'none') {
            ctx.shadowBlur = 5;
            ctx.shadowColor = 'rgba(0,0,0,0.2)';
            
            if (customization.hat === 'cap') {
                ctx.fillStyle = colors.accent;
                ctx.fillRect(x + w/2 - 10, y - 4, 20, 6);
                ctx.fillRect(x + w/2 + 4, y - 10, 10, 6);
                ctx.fillStyle = '#fff';
                ctx.fillRect(x + w/2 - 6, y - 2, 4, 3);
            } else if (customization.hat === 'tophat') {
                ctx.fillStyle = '#2d1b0e';
                ctx.fillRect(x + w/2 - 10, y - 16, 20, 12);
                ctx.fillRect(x + w/2 - 14, y - 4, 28, 4);
                ctx.fillStyle = '#e94560';
                ctx.fillRect(x + w/2 - 2, y - 16, 4, 2);
            } else if (customization.hat === 'crown') {
                ctx.fillStyle = '#fbbf24';
                ctx.fillRect(x + w/2 - 12, y - 8, 24, 6);
                for (let i = -8; i <= 8; i += 8) {
                    ctx.fillRect(x + w/2 + i, y - 12, 4, 6);
                    ctx.fillStyle = '#ef4444';
                    ctx.fillRect(x + w/2 + i + 1, y - 14, 2, 3);
                    ctx.fillStyle = '#fbbf24';
                }
            } else if (customization.hat === 'sombrero') {
                ctx.fillStyle = '#d4a373';
                ctx.fillRect(x + w/2 - 16, y - 2, 32, 4);
                ctx.fillRect(x + w/2 - 8, y - 12, 16, 10);
                ctx.fillStyle = '#f4a261';
                ctx.fillRect(x + w/2 - 14, y - 2, 28, 2);
            } else if (customization.hat === 'wizard') {
                ctx.fillStyle = '#6c3a9e';
                ctx.beginPath();
                ctx.moveTo(x + w/2 - 12, y - 4);
                ctx.lineTo(x + w/2, y - 28);
                ctx.lineTo(x + w/2 + 12, y - 4);
                ctx.fill();
                ctx.fillStyle = '#fbbf24';
                ctx.beginPath();
                ctx.arc(x + w/2, y - 28, 4, 0, Math.PI * 2);
                ctx.fill();
            } else if (customization.hat === 'santa') {
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(x + w/2 - 12, y - 4, 24, 8);
                ctx.beginPath();
                ctx.moveTo(x + w/2 - 12, y - 4);
                ctx.lineTo(x + w/2, y - 18);
                ctx.lineTo(x + w/2 + 12, y - 4);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.fillRect(x + w/2 - 14, y - 3, 28, 3);
                ctx.beginPath();
                ctx.arc(x + w/2, y - 18, 4, 0, Math.PI * 2);
                ctx.fill();
            } else if (customization.hat === 'ninja') {
                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(x + w/2 - 14, y - 6, 28, 10);
                ctx.fillRect(x + w/2 - 2, y - 14, 4, 8);
                ctx.fillStyle = '#e94560';
                ctx.fillRect(x + w/2 - 10, y - 4, 20, 2);
            } else if (customization.hat === 'pirates') {
                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(x + w/2 - 12, y - 4, 24, 6);
                ctx.beginPath();
                ctx.moveTo(x + w/2 - 12, y - 4);
                ctx.lineTo(x + w/2 - 6, y - 18);
                ctx.lineTo(x + w/2, y - 8);
                ctx.lineTo(x + w/2 + 6, y - 18);
                ctx.lineTo(x + w/2 + 12, y - 4);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(x + w/2 - 4, y - 18, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x + w/2 + 4, y - 18, 3, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // Accesorios (código existente...)
        if (customization.accessory !== 'none') {
            ctx.shadowBlur = 5;
            ctx.shadowColor = 'rgba(0,0,0,0.2)';
            
            if (customization.accessory === 'scarf') {
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(x + 2, y + 18, w - 4, 8);
                ctx.fillRect(x - 6, y + 20, 8, 12);
                ctx.fillRect(x + w - 2, y + 20, 8, 12);
            } else if (customization.accessory === 'glasses') {
                ctx.strokeStyle = '#2d1b0e';
                ctx.lineWidth = 2;
                ctx.strokeRect(x + w/2 - 10, y + 4, 8, 6);
                ctx.strokeRect(x + w/2 + 2, y + 4, 8, 6);
                ctx.beginPath();
                ctx.moveTo(x + w/2 - 2, y + 7);
                ctx.lineTo(x + w/2 + 2, y + 7);
                ctx.stroke();
            } else if (customization.accessory === 'cape') {
                ctx.fillStyle = 'rgba(233,69,96,0.35)';
                ctx.fillRect(x - 10, y + 14, 8, 22);
                ctx.fillRect(x + w + 2, y + 14, 8, 22);
                ctx.fillStyle = 'rgba(233,69,96,0.2)';
                ctx.fillRect(x - 6, y + 18, 4, 18);
                ctx.fillRect(x + w + 2, y + 18, 4, 18);
            } else if (customization.accessory === 'backpack') {
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(x - 4, y + 16, 8, 16);
                ctx.fillRect(x + w - 4, y + 16, 8, 16);
                ctx.fillStyle = '#A0522D';
                ctx.fillRect(x - 2, y + 18, 4, 4);
                ctx.fillRect(x + w - 2, y + 18, 4, 4);
            }
        }
        
        // Cabello
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#2d1b0e';
        ctx.beginPath();
        ctx.arc(x + w/2, y + 2, 15, Math.PI, 2 * Math.PI);
        ctx.fill();
        
        // Brillo
        ctx.fillStyle = 'rgba(255,255,255,0.05)';
        ctx.fillRect(x + 4, y + 14, 6, 8);
        
        ctx.shadowBlur = 0;
    }
    
    // ================================================================
    //  FUNCIONES AUXILIARES
    // ================================================================
    function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
    }
    
    function drawSpike(x, y, w, h) {
        ctx.shadowBlur = 20;
        ctx.shadowColor = 'rgba(255,0,0,0.5)';
        
        const grad = ctx.createLinearGradient(x, y, x, y + h);
        grad.addColorStop(0, '#ff4757');
        grad.addColorStop(0.5, '#e94560');
        grad.addColorStop(1, '#c23152');
        ctx.fillStyle = grad;
        
        ctx.beginPath();
        ctx.moveTo(x, y + h);
        const points = 7;
        for (let i = 0; i <= points; i++) {
            const px = x + (i / points) * w;
            const py = (i % 2 === 0) ? y : y + h;
            ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(255,100,100,0.3)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x, y + h);
        for (let i = 0; i <= points; i++) {
            const px = x + (i / points) * w;
            const py = (i % 2 === 0) ? y : y + h;
            ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.stroke();
    }
    
    function darkenColor(color, amount) {
        // Para colores HSL
        if (color.startsWith('hsl')) {
            const match = color.match(/hsl\((\d+),\s*(\d+)%,\s*(\d+)%\)/);
            if (match) {
                const h = parseInt(match[1]);
                const s = parseInt(match[2]);
                const l = Math.max(0, parseInt(match[3]) * (1 - amount));
                return `hsl(${h}, ${s}%, ${l}%)`;
            }
        }
        // Para colores HEX
        let r = parseInt(color.slice(1,3), 16);
        let g = parseInt(color.slice(3,5), 16);
        let b = parseInt(color.slice(5,7), 16);
        r = Math.floor(r * (1 - amount));
        g = Math.floor(g * (1 - amount));
        b = Math.floor(b * (1 - amount));
        return `rgb(${r},${g},${b})`;
    }
    
    // ================================================================
    //  FONDOS DINÁMICOS
    // ================================================================
    function drawBackground(level) {
        const theme = level.theme;
        const bg = theme.bg || 'forest';
        
        // Usar skyColor dinámico
        const skyColor = theme.skyColor || '#0d1f2d';
        const groundColor = theme.color || '#1a3a2a';
        
        const grad = ctx.createLinearGradient(0, 0, 0, H);
        grad.addColorStop(0, skyColor);
        grad.addColorStop(0.5, darkenColor(skyColor, 0.3));
        grad.addColorStop(1, groundColor);
        ctx.fillStyle = grad;
        ctx.fillRect(cameraX, 0, W, H);
        
        switch(bg) {
            case 'forest': drawForest(); break;
            case 'desert': drawDesert(); break;
            case 'tundra': drawTundra(); break;
            case 'volcano': drawVolcano(); break;
            case 'space': drawSpace(); break;
        }
    }
    
    function drawForest() {
        for (let i = 0; i < 30; i++) {
            const x = ((i * 67 + 20 + cameraX * 0.5) % W + W) % W + cameraX;
            const h = 40 + (i % 5) * 20;
            ctx.fillStyle = `rgba(30,80,40,${0.05 + (i % 3) * 0.02})`;
            ctx.fillRect(x, H - h, 8, h);
            ctx.beginPath();
            ctx.arc(x + 4, H - h, 15 + (i % 10), 0, Math.PI * 2);
            ctx.fill();
        }
    }
    
    function drawDesert() {
        for (let i = 0; i < 40; i++) {
            const x = ((i * 47 + 10 + cameraX * 0.7) % W + W) % W + cameraX;
            const h = 10 + (i % 8) * 8;
            ctx.fillStyle = `rgba(200,150,80,${0.03 + (i % 5) * 0.015})`;
            ctx.beginPath();
            ctx.moveTo(x, H - 5);
            ctx.quadraticCurveTo(x + 15, H - 5 - h, x + 30, H - 5);
            ctx.fill();
        }
    }
    
    function drawTundra() {
        for (let i = 0; i < 50; i++) {
            const x = ((i * 33 + 15 + cameraX * 0.3 + frameCount * 0.2) % W + W) % W + cameraX;
            const y = (i * 47 + 20 + frameCount * 0.1) % H;
            ctx.fillStyle = `rgba(255,255,255,${0.03 + (i % 5) * 0.01})`;
            ctx.beginPath();
            ctx.arc(x, y, 2 + (i % 3), 0, Math.PI * 2);
            ctx.fill();
        }
    }
    
    function drawVolcano() {
        for (let i = 0; i < 20; i++) {
            const x = ((i * 97 + cameraX * 0.4 + frameCount * 0.3) % W + W) % W + cameraX;
            const y = H - 10 + Math.sin(frameCount * 0.02 + i) * 5;
            ctx.fillStyle = `rgba(255,100,0,${0.05 + (i % 4) * 0.02})`;
            ctx.fillRect(x, y, 15 + (i % 10), 3);
        }
    }
    
    function drawSpace() {
        for (let i = 0; i < 100; i++) {
            const x = ((i * 137 + 50 + cameraX * 0.2) % W + W) % W + cameraX;
            const y = (i * 251 + 30) % H;
            const s = (i % 3) + 1;
            const a = 0.1 + (i % 5) * 0.05;
            ctx.fillStyle = `rgba(255,255,255,${a})`;
            ctx.fillRect(x, y, s, s);
        }
    }
    
    // ================================================================
    //  CONTROLES (sin cambios)
    // ================================================================
    document.addEventListener('keydown', (e) => {
        keys[e.code] = true;
        if (e.code === 'KeyR') resetCurrentLevel();
        if (e.code === 'KeyP') {
            gameRunning = !gameRunning;
            if (!gameRunning) showMessage('⏸️ PAUSA', 500);
            else showMessage('▶️ CONTINUAR', 500);
        }
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
            e.preventDefault();
        }
    });
    
    document.addEventListener('keyup', (e) => {
        keys[e.code] = false;
    });
    
    function setupMobileControls() {
        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');
        const btnJump = document.getElementById('btnJump');
        
        const addTouch = (el, key) => {
            el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
            el.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
            el.addEventListener('touchcancel', (e) => { keys[key] = false; });
            el.addEventListener('mousedown', () => { keys[key] = true; });
            el.addEventListener('mouseup', () => { keys[key] = false; });
            el.addEventListener('mouseleave', () => { keys[key] = false; });
        };
        
        addTouch(btnLeft, 'left');
        addTouch(btnRight, 'right');
        addTouch(btnJump, 'jump');
    }
    setupMobileControls();
    
    // ================================================================
    //  MENÚ (sin cambios)
    // ================================================================
    document.querySelectorAll('.menu-tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.menu-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            const panelId = 'panel-' + tab.dataset.tab;
            document.querySelectorAll('.menu-panel').forEach(p => p.classList.remove('active'));
            document.getElementById(panelId).classList.add('active');
        });
    });
    
    document.querySelectorAll('.world-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.world-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedWorld = parseInt(btn.dataset.world);
        });
    });
    
    document.querySelectorAll('.custom-item').forEach(item => {
        item.addEventListener('click', () => {
            const custom = item.dataset.custom;
            const value = item.dataset.value;
            document.querySelectorAll(`.custom-item[data-custom="${custom}"]`).forEach(el => {
                el.classList.remove('active');
            });
            item.classList.add('active');
            customization[custom] = value;
        });
    });
    
    menuStartBtn.addEventListener('click', () => {
        currentWorld = selectedWorld;
        currentLevelInWorld = 0;
        hearts = MAX_HEARTS;
        totalDeaths = 0;
        showMenu = false;
        menuOverlay.classList.add('hidden');
        levelTransitioning = false;
        initLevel();
    });
    
    menuBtn.addEventListener('click', () => {
        showMenu = true;
        menuOverlay.classList.remove('hidden');
        gameRunning = false;
    });
    
    // ================================================================
    //  BOTONES (sin cambios)
    // ================================================================
    document.getElementById('restartBtn').addEventListener('click', resetCurrentLevel);
    document.getElementById('resetGameBtn').addEventListener('click', resetFullGame);
    
    document.getElementById('prevWorldBtn').addEventListener('click', () => {
        if (currentWorld > 0) {
            currentWorld--;
            currentLevelInWorld = 0;
            hearts = MAX_HEARTS;
            levelTransitioning = false;
            initLevel();
            showMessage(`🌍 Mundo ${currentWorld + 1}`, 1000);
        }
    });
    
    document.getElementById('nextWorldBtn').addEventListener('click', () => {
        if (currentWorld < TOTAL_WORLDS - 1) {
            currentWorld++;
            currentLevelInWorld = 0;
            hearts = MAX_HEARTS;
            levelTransitioning = false;
            initLevel();
            showMessage(`🌍 Mundo ${currentWorld + 1}`, 1000);
        }
    });
    
    document.getElementById('prevLevelBtn').addEventListener('click', () => {
        if (currentLevelInWorld > 0) {
            currentLevelInWorld--;
            hearts = MAX_HEARTS;
            levelTransitioning = false;
            initLevel();
            showMessage(`⬅️ Nivel ${currentLevelInWorld + 1}`, 1000);
        } else if (currentWorld > 0) {
            currentWorld--;
            currentLevelInWorld = LEVELS_PER_WORLD - 1;
            hearts = MAX_HEARTS;
            levelTransitioning = false;
            initLevel();
            showMessage(`🌍 Mundo ${currentWorld + 1} - Nivel ${LEVELS_PER_WORLD}`, 1000);
        }
    });
    
    document.getElementById('nextLevelBtn').addEventListener('click', () => {
        if (currentLevelInWorld < LEVELS_PER_WORLD - 1) {
            currentLevelInWorld++;
            hearts = MAX_HEARTS;
            levelTransitioning = false;
            initLevel();
            showMessage(`➡️ Nivel ${currentLevelInWorld + 1}`, 1000);
        } else if (currentWorld < TOTAL_WORLDS - 1) {
            currentWorld++;
            currentLevelInWorld = 0;
            hearts = MAX_HEARTS;
            levelTransitioning = false;
            initLevel();
            showMessage(`🌍 Mundo ${currentWorld + 1} - Nivel 1`, 1000);
        }
    });
    
    // ================================================================
    //  REINICIOS (sin cambios)
    // ================================================================
    function resetCurrentLevel() {
        hearts = MAX_HEARTS;
        particles = [];
        gameRunning = true;
        deathAnimation = false;
        levelTransitioning = false;
        initLevel();
        showMessage('🔄 Nivel Reiniciado', 800);
    }
    
    function resetFullGame() {
        currentWorld = 0;
        currentLevelInWorld = 0;
        hearts = MAX_HEARTS;
        totalDeaths = 0;
        particles = [];
        gameRunning = true;
        deathAnimation = false;
        levelTransitioning = false;
        comboCount = 0;
        showMenu = true;
        menuOverlay.classList.remove('hidden');
        initLevel();
        showMessage('✨ Nuevo Juego Iniciado ✨', 1500);
    }
    
    // ================================================================
    //  INICIALIZAR
    // ================================================================
    function init() {
        generateAllLevels();
        initLevel();
        gameLoop();
        resizeCanvas();
    }
    
    function resizeCanvas() {
        const container = document.getElementById('gameContainer');
        const maxWidth = window.innerWidth - 20;
        const maxHeight = window.innerHeight - 20;
        const aspectRatio = 1200 / 550;
        
        let width = Math.min(1200, maxWidth);
        let height = width / aspectRatio;
        
        if (height > maxHeight) {
            height = maxHeight;
            width = height * aspectRatio;
        }
        
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        
        const mobileControls = document.getElementById('mobileControls');
        if (window.innerWidth < 768 || 'ontouchstart' in window) {
            mobileControls.style.display = 'flex';
        }
    }
    
    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('orientationchange', () => {
        setTimeout(resizeCanvas, 300);
    });
    
    // ================================================================
    //  BUCLE PRINCIPAL
    // ================================================================
    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }
    
    init();
    
    console.log('⚡ DEVIL\'S ASCENT - EDICIÓN DEFINITIVA');
    console.log(`📊 ${TOTAL_WORLDS} Mundos × ${LEVELS_PER_WORLD} Niveles = ${TOTAL_WORLDS * LEVELS_PER_WORLD} Niveles`);
    console.log('🎨 Paisajes dinámicos que cambian cada nivel');
    console.log('📏 Niveles más largos con scroll horizontal');
    console.log('🆕 Nuevos obstáculos: rotatorios, enemigos, coleccionables');
    console.log('💾 Sistema de checkpoints');
    console.log('📱 Compatible PC y Móvil');
</script>
