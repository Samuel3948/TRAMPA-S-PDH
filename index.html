    document.getElementById('nextWorldBtn').addEventListener('click', () => {
        if (currentWorld < TOTAL_WORLDS - 1) {
            currentWorld++;
            currentLevelInWorld = 0;
            hearts = MAX_HEARTS;
            initLevel();
            showMessage(`🌍 Mundo ${currentWorld + 1}`, 1000);
        }
    });
    
    document.getElementById('prevLevelBtn').addEventListener('click', () => {
        if (currentLevelInWorld > 0) {
            currentLevelInWorld--;
            hearts = MAX_HEARTS;
            initLevel();
            showMessage(`⬅️ Nivel ${currentLevelInWorld + 1}`, 1000);
        } else if (currentWorld > 0) {
            currentWorld--;
            currentLevelInWorld = LEVELS_PER_WORLD - 1;
            hearts = MAX_HEARTS;
            initLevel();
            showMessage(`🌍 Mundo ${currentWorld + 1} - Nivel ${LEVELS_PER_WORLD}`, 1000);
        }
    });
    
    document.getElementById('nextLevelBtn').addEventListener('click', () => {
        if (currentLevelInWorld < LEVELS_PER_WORLD - 1) {
            currentLevelInWorld++;
            hearts = MAX_HEARTS;
            initLevel();
            showMessage(`➡️ Nivel ${currentLevelInWorld + 1}`, 1000);
        } else if (currentWorld < TOTAL_WORLDS - 1) {
            currentWorld++;
            currentLevelInWorld = 0;
            hearts = MAX_HEARTS;
            initLevel();
            showMessage(`🌍 Mundo ${currentWorld + 1} - Nivel 1`, 1000);
        }
    });
    
    // ================================================================
    //  REINICIOS
    // ================================================================
    function resetCurrentLevel() {
        hearts = MAX_HEARTS;
        particles = [];
        gameRunning = true;
        deathAnimation = false;
        initLevel();
        showMessage('🔄 Nivel Reiniciado', 800);
    }
    
    function resetFullGame() {
        currentWorld = 0;
        currentLevelInWorld = 0;
        hearts = MAX_HEARTS;
        totalDeaths = 0;
        particles = [];
        gameRunning = true;
        deathAnimation = false;
        comboCount = 0;
        showMenu = true;
        menuOverlay.classList.remove('hidden');
        initLevel();
        showMessage('✨ Nuevo Juego Iniciado ✨', 1500);
    }
    
    // ================================================================
    //  INICIALIZAR
    // ================================================================
    function init() {
        generateAllLevels();
        initLevel();
        gameLoop();
        resizeCanvas();
    }
    
    // ================================================================
    //  RESIZE
    // ================================================================
    function resizeCanvas() {
        const container = document.getElementById('gameContainer');
        const maxWidth = window.innerWidth - 20;
        const maxHeight = window.innerHeight - 20;
        const aspectRatio = 900 / 550;
        
        let width = Math.min(900, maxWidth);
        let height = width / aspectRatio;
        
        if (height > maxHeight) {
            height = maxHeight;
            width = height * aspectRatio;
        }
        
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        
        const mobileControls = document.getElementById('mobileControls');
        if (window.innerWidth < 768 || 'ontouchstart' in window) {
            mobileControls.style.display = 'flex';
        }
    }
    
    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('orientationchange', () => {
        setTimeout(resizeCanvas, 300);
    });
    
    // ================================================================
    //  BUCLE PRINCIPAL
    // ================================================================
    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }
    
    // ================================================================
    //  INICIAR
    // ================================================================
    init();
    
    console.log('🌟 DEVIL\'S ASCENT - EDICIÓN DEFINITIVA');
    console.log(`📊 ${TOTAL_WORLDS} Mundos × ${LEVELS_PER_WORLD} Niveles = ${TOTAL_LEVELS} Niveles`);
    console.log('🎨 Personalización: Colores, sombreros y accesorios');
    console.log('🦾 Personaje con brazos animados');
    console.log('⚠️ Todas las trampas: púas fijas, pulsantes, láseres, plataformas móviles y que caen');
    console.log('🏆 Paso automático al tocar la meta dorada');
    console.log('📱 Compatible PC y Móvil');
    
    // ================================================================
    //  FIN DEL CÓDIGO
    // ================================================================
</script>
</body>
</html>
