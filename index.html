<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ DEVIL'S ASCENT - Edición Definitiva</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        body {
            background: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        
        #gameWrapper {
            background: linear-gradient(145deg, #1a1a3e, #0a0a1a);
            border-radius: 25px;
            padding: 15px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.05);
            border: 2px solid rgba(233, 69, 96, 0.3);
            max-width: 98vw;
            position: relative;
        }
        
        #gameContainer {
            position: relative;
            background: #0f1a2e;
            border-radius: 15px;
            overflow: hidden;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: auto;
            background: #0f1a2e;
            touch-action: none;
            cursor: pointer;
        }
        
        /* ===== MENÚ DE INICIO ===== */
        #menuOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            padding: 20px;
            overflow-y: auto;
        }
        
        #menuOverlay.hidden { display: none; }
        
        #menuTitle {
            font-size: 38px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 40px rgba(233,69,96,0.6), 0 4px 20px rgba(0,0,0,0.8);
            margin-bottom: 3px;
            text-align: center;
            letter-spacing: 2px;
        }
        
        #menuSubtitle {
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            margin-bottom: 15px;
            text-align: center;
            letter-spacing: 3px;
        }
        
        .menu-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .menu-tab {
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 8px 18px;
            color: rgba(255,255,255,0.6);
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            touch-action: manipulation;
        }
        
        .menu-tab:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .menu-tab.active { background: rgba(233,69,96,0.2); border-color: #e94560; color: #fff; }
        
        .menu-panel {
            display: none;
            width: 100%;
            max-width: 600px;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            padding: 8px;
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
            max-height: 160px;
            overflow-y: auto;
        }
        
        .menu-panel.active { display: flex; }
        
        .menu-panel::-webkit-scrollbar { width: 4px; }
        .menu-panel::-webkit-scrollbar-thumb { background: #e94560; border-radius: 10px; }
        
        .custom-item {
            background: rgba(255,255,255,0.06);
            border: 2px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 5px 10px;
            color: #fff;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            touch-action: manipulation;
            text-align: center;
            min-width: 45px;
        }
        
        .custom-item:hover { background: rgba(255,255,255,0.12); }
        .custom-item.active { border-color: #e94560; background: rgba(233,69,96,0.25); box-shadow: 0 0 20px rgba(233,69,96,0.2); }
        .custom-item .emoji { font-size: 18px; display: block; }
        .custom-item .label { font-size: 9px; opacity: 0.7; }
        
        #menuWorldSelect {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            max-width: 600px;
            margin-bottom: 10px;
        }
        
        .world-btn {
            background: linear-gradient(145deg, #1a1a3e, #2a2a5e);
            border: 2px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 10px 18px;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 80px;
            text-align: center;
            font-family: inherit;
            touch-action: manipulation;
        }
        
        .world-btn:hover { transform: scale(1.05); border-color: rgba(233,69,96,0.4); }
        .world-btn:active { transform: scale(0.95); }
        .world-btn .emoji { font-size: 24px; display: block; margin-bottom: 3px; }
        .world-btn .name { font-size: 12px; }
        .world-btn .levels-info { font-size: 10px; color: rgba(255,255,255,0.3); margin-top: 2px; }
        .world-btn.selected { border-color: #e94560; background: linear-gradient(145deg, #2a2a5e, #3a3a7e); box-shadow: 0 0 30px rgba(233,69,96,0.2); }
        
        #menuStartBtn {
            background: linear-gradient(145deg, #e94560, #c23152);
            border: none;
            border-radius: 16px;
            padding: 14px 45px;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            touch-action: manipulation;
            box-shadow: 0 8px 30px rgba(233,69,96,0.4);
            margin-top: 8px;
        }
        
        #menuStartBtn:hover { transform: scale(1.05); box-shadow: 0 12px 40px rgba(233,69,96,0.6); }
        #menuStartBtn:active { transform: scale(0.95); }
        
        /* ===== UI DEL JUEGO ===== */
        #topUI {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 14px;
            background: rgba(0,0,0,0.7);
            border-radius: 12px 12px 0 0;
            border-bottom: 2px solid rgba(233,69,96,0.3);
            flex-wrap: wrap;
            gap: 4px;
        }
        
        #topUI > div {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #eee;
            font-size: 12px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        
        .ui-icon { font-size: 14px; }
        .ui-value { background: rgba(0,0,0,0.4); padding: 2px 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); min-width: 20px; text-align: center; }
        .health-hearts { color: #ff4757; font-size: 14px; letter-spacing: 1px; }
        .world-badge { background: linear-gradient(135deg, #e94560, #c23152); padding: 2px 10px; border-radius: 20px; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .difficulty-badge { background: rgba(255,255,255,0.1); padding: 2px 10px; border-radius: 20px; font-size: 10px; border: 1px solid rgba(255,255,255,0.1); }
        
        #bottomUI {
            display: flex;
            justify-content: center;
            gap: 5px;
            padding: 6px 10px;
            background: rgba(0,0,0,0.7);
            border-radius: 0 0 12px 12px;
            border-top: 2px solid rgba(233,69,96,0.3);
            flex-wrap: wrap;
        }
        
        #bottomUI button {
            background: linear-gradient(145deg, #2a2a5e, #1a1a3e);
            color: #fff;
            border: 1px solid rgba(233,69,96,0.3);
            padding: 5px 12px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            touch-action: manipulation;
            min-height: 34px;
            min-width: 34px;
        }
        
        #bottomUI button:hover { background: linear-gradient(145deg, #3a3a7e, #2a2a5e); transform: scale(1.05); border-color: #e94560; }
        #bottomUI button:active { transform: scale(0.95); }
        .btn-primary { background: linear-gradient(145deg, #e94560, #c23152) !important; border-color: #e94560 !important; }
        .btn-primary:hover { background: linear-gradient(145deg, #ff6b81, #e94560) !important; }
        
        #mobileControls {
            display: none;
            justify-content: space-between;
            padding: 6px 10px 3px 10px;
            gap: 6px;
        }
        
        .mobile-btn {
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            color: #fff;
            font-size: 20px;
            padding: 8px 14px;
            min-width: 46px;
            min-height: 46px;
            text-align: center;
            touch-action: manipulation;
            cursor: pointer;
            transition: all 0.1s;
            backdrop-filter: blur(5px);
            font-weight: bold;
        }
        
        .mobile-btn:active { background: rgba(233,69,96,0.4); transform: scale(0.92); border-color: #e94560; }
        .mobile-btn.jump-btn { background: rgba(233,69,96,0.3); border-color: rgba(233,69,96,0.5); min-width: 60px; font-size: 16px; }
        .mobile-btn.jump-btn:active { background: rgba(233,69,96,0.6); }
        .mobile-dpad { display: flex; gap: 5px; }
        
        #messageOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 20;
        }
        
        #messageText {
            color: #fff;
            font-size: 26px;
            font-weight: bold;
            text-shadow: 0 0 40px rgba(233,69,96,0.8), 0 4px 20px rgba(0,0,0,0.8);
            text-align: center;
            padding: 14px 20px;
            opacity: 0;
            transition: opacity 0.4s;
            background: rgba(0,0,0,0.6);
            border-radius: 16px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
            max-width: 90%;
        }
        
        #messageText.show { opacity: 1; }
        .key-hint { color: rgba(255,255,255,0.2); font-size: 9px; text-align: center; padding: 3px 0 1px 0; letter-spacing: 1px; }
        
        @media (max-width: 768px) {
            #gameWrapper { padding: 6px; border-radius: 12px; }
            #topUI { padding: 4px 8px; font-size: 10px; }
            #topUI > div { font-size: 10px; gap: 3px; }
            .health-hearts { font-size: 12px; }
            .world-badge { font-size: 8px; padding: 2px 6px; }
            #bottomUI { padding: 4px 6px; gap: 3px; }
            #bottomUI button { padding: 4px 8px; font-size: 9px; min-height: 28px; min-width: 28px; }
            #mobileControls { display: flex !important; }
            .key-hint { display: none; }
            #menuTitle { font-size: 24px; }
            #menuSubtitle { font-size: 11px; }
            .world-btn { padding: 6px 12px; font-size: 11px; min-width: 60px; }
            .world-btn .emoji { font-size: 18px; }
            #menuStartBtn { padding: 10px 25px; font-size: 16px; }
            .menu-tab { padding: 5px 12px; font-size: 11px; }
            .custom-item { padding: 4px 8px; font-size: 10px; min-width: 40px; }
            .custom-item .emoji { font-size: 16px; }
            .menu-panel { max-height: 140px; gap: 4px; padding: 6px; }
            #messageText { font-size: 18px; padding: 10px 14px; }
        }
        
        @media (pointer: coarse) { #mobileControls { display: flex !important; } .key-hint { display: none; } }
        @media (max-width: 480px) {
            #topUI > div { font-size: 8px; }
            .health-hearts { font-size: 10px; }
            .mobile-btn { font-size: 16px; padding: 5px 10px; min-width: 36px; min-height: 36px; }
            .mobile-btn.jump-btn { min-width: 48px; font-size: 12px; }
            #menuTitle { font-size: 20px; }
            .world-btn { padding: 4px 8px; font-size: 10px; min-width: 50px; }
            .world-btn .emoji { font-size: 14px; }
            #menuStartBtn { padding: 8px 18px; font-size: 14px; }
            #messageText { font-size: 14px; padding: 8px 12px; }
        }
    </style>
</head>
<body>

<div id="gameWrapper">
    <div id="gameContainer">
        <!-- ===== MENÚ DE INICIO ===== -->
        <div id="menuOverlay">
            <div id="menuTitle">⚡ DEVIL'S ASCENT</div>
            <div id="menuSubtitle">— EDICIÓN DEFINITIVA —</div>
            
            <div id="menuWorldSelect">
                <button class="world-btn selected" data-world="0"><span class="emoji">🌲</span><span class="name">Bosque</span><span class="levels-info">50 niveles</span></button>
                <button class="world-btn" data-world="1"><span class="emoji">🏜️</span><span class="name">Desierto</span><span class="levels-info">50 niveles</span></button>
                <button class="world-btn" data-world="2"><span class="emoji">❄️</span><span class="name">Tundra</span><span class="levels-info">50 niveles</span></button>
                <button class="world-btn" data-world="3"><span class="emoji">🌋</span><span class="name">Volcán</span><span class="levels-info">50 niveles</span></button>

            <div class="menu-tabs">
                <button class="menu-tab active" data-tab="colors">🎨 Colores</button>

            </div>
            
            <div class="menu-panel active" id="panel-colors">
                <button class="custom-item active" data-custom="color" data-value="blue"><span class="emoji">🔵</span><span class="label">Azul</span></button>

                <button class="custom-item" data-custom="color" data-value="green"><span class="emoji">🟢</span><span class="label">Verde</span></button>
                <button class="custom-item" data-custom="color" data-value="purple"><span class="emoji">🟣</span><span class="label">Púrpura</span></button>
                <button class="custom-item" data-custom="color" data-value="gold"><span class="emoji">🟡</span><span class="label">Dorado</span></button>
                <button class="custom-item" data-custom="color" data-value="pink"><span class="emoji">🩷</span><span class="label">Rosa</span></button>
                <button class="custom-item" data-custom="color" data-value="cyan"><span class="emoji">🩵</span><span class="label">Cian</span></button>
                <button class="custom-item" data-custom="color" data-value="orange"><span class="emoji">🟠</span><span class="label">Naranja</span></button>
            </div>
            
            <div class="menu-panel" id="panel-hats">
                <button class="custom-item active" data-custom="hat" data-value="none"><span class="emoji">👤</span><span class="label">Sin</span></button>
                <button class="custom-item" data-custom="hat" data-value="cap"><span class="emoji">🧢</span><span class="label">Gorra</span></button>
                <button class="custom-item" data-custom="hat" data-value="tophat"><span class="emoji">🎩</span><span class="label">Chistera</span></button>
                <button class="custom-item" data-custom="hat" data-value="crown"><span class="emoji">👑</span><span class="label">Corona</span></button>
                <button class="custom-item" data-custom="hat" data-value="sombrero"><span class="emoji">🤠</span><span class="label">Sombrero</span></button>
                <button class="custom-item" data-custom="hat" data-value="wizard"><span class="emoji">🧙</span><span class="label">Mago</span></button>
                <button class="custom-item" data-custom="hat" data-value="santa"><span class="emoji">🎅</span><span class="label">Navidad</span></button>
                <button class="custom-item" data-custom="hat" data-value="ninja"><span class="emoji">🥷</span><span class="label">Ninja</span></button>
                <button class="custom-item" data-custom="hat" data-value="pirates"><span class="emoji">🏴‍☠️</span><span class="label">Pirata</span></button>
            </div>
            
            <div class="menu-panel" id="panel-accessories">
                <button class="custom-item active" data-custom="accessory" data-value="none"><span class="emoji">❌</span><span class="label">Sin</span></button>
                <button class="custom-item" data-custom="accessory" data-value="scarf"><span class="emoji">🧣</span><span class="label">Bufanda</span></button>
                <button class="custom-item" data-custom="accessory" data-value="glasses"><span class="emoji">🕶️</span><span class="label">Gafas</span></button>
                <button class="custom-item" data-custom="accessory" data-value="cape"><span class="emoji">🧥</span><span class="label">Capa</span></button>
                <button class="custom-item" data-custom="accessory" data-value="backpack"><span class="emoji">🎒</span><span class="label">Mochila</span></button>
                <button class="custom-item" data-custom="accessory" data-value="wings"><span class="emoji">🦋</span><span class="label">Alas</span></button>
                <button class="custom-item" data-custom="accessory" data-value="shield"><span class="emoji">🛡️</span><span class="label">Escudo</span></button>
                <button class="custom-item" data-custom="accessory" data-value="sword"><span class="emoji">⚔️</span><span class="label">Espada</span></button>

            <div class="menu-panel" id="panel-extras">
                <button class="custom-item active" data-custom="extra" data-value="none"><span class="emoji">❌</span><span class="label">Sin</span></button>
                <button class="custom-item" data-custom="extra" data-value="glow"><span class="emoji">✨</span><span class="label">Brillo</span></button>
                <button class="custom-item" data-custom="extra" data-value="fire"><span class="emoji">🔥</span><span class="label">Fuego</span></button>
                <button class="custom-item" data-custom="extra" data-value="ice"><span class="emoji">❄️</span><span class="label">Hielo</span></button>
                <button class="custom-item" data-custom="extra" data-value="electric"><span class="emoji">⚡</span><span class="label">Eléctrico</span></button>

        <!-- ===== UI DEL JUEGO ===== -->
        <div id="topUI">
            <div>
                <span class="ui-icon">🌍</span>
                <span class="world-badge" id="worldDisplay">Mundo 1</span>
                <span class="ui-icon">🏆</span>
                <span class="ui-value" id="levelDisplay">1</span>
                <span style="color:rgba(255,255,255,0.3);">/</span>
                <span style="color:rgba(255,255,255,0.5);" id="maxLevelDisplay">50</span>
                <span class="difficulty-badge" id="difficultyDisplay">⭐</span>
            </div>
            <div>
                <span class="ui-icon">❤️</span>
                <span class="health-hearts" id="heartsDisplay">❤️❤️❤️</span>
            </div>
            <div>
                <span class="ui-icon">⏱️</span>
                <span class="ui-value" id="timerDisplay">0</span>
                <span style="color:rgba(255,255,255,0.3);">s</span>

                <span class="ui-icon">💀</span>
                <span class="ui-value" id="deathsDisplay">0</span>
            </div>
